<pattern id="bricks" width="64" height="32" patternUnits="userSpaceOnUse">
  <path d="M0 .5H64M0 16.5H64M32 0V16M.5 16V32" stroke="#000" stroke-opacity=".22" fill="none"/></pattern>
</defs>
