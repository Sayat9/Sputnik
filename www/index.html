<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120E09">
<title>Спутник исследователя</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one narrow column like a field notebook, sticky header, tab bar at the bottom; amber = magic stone */
:root {
  --bg: #ECEDEA;
  --surface: #F8F8F6;
  --sunk: #E2E4DF;
  --line: #D1D5CE;
  --fg: #1D221F;
  --muted: #5B635E;
  --accent: #8A5A14;
  --accent-bright: #C2851F;
  --accent-soft: #F2E6CF;
  --plus: #2D7346;
  --minus: #A13A2E;
  --iron: #3E4B53;
  --iron-soft: #DDE3E6;
  --art-bg: #1A1D1B;
  --scrim: rgb(10 12 11 / .5);
  --shadow: 0 1px 2px rgb(30 35 32 / .08);
  --f-display: "Kelly Slab", "Georgia", serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-fancy: "Cormorant SC", "Kelly Slab", Georgia, serif;
  /* Fantasy screens (main, character forge) keep one deliberate dark look in both themes */
  --fx-bg: #15110C; --fx-bg2: #221911; --fx-panel: #2A2017; --fx-panel2: #35291C;
  --fx-line: #6E5634; --fx-gold: #D6A64C; --fx-gold-hi: #F4D48E;
  --fx-text: #F0E6D0; --fx-muted: #B9A684; --fx-danger: #EC8B74; --fx-ink: #1D140A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131715; --surface: #1B201E; --sunk: #232927; --line: #2F3633;
    --fg: #E5E8E2; --muted: #9AA39D; --accent: #E2AA4C; --accent-bright: #E8B355;
    --accent-soft: #392D18; --plus: #6FC08C; --minus: #E5806F;
    --iron: #B6C4CC; --iron-soft: #26313A; --art-bg: #0E100F; --scrim: rgb(0 0 0 / .6);
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131715; --surface: #1B201E; --sunk: #232927; --line: #2F3633;
  --fg: #E5E8E2; --muted: #9AA39D; --accent: #E2AA4C; --accent-bright: #E8B355;
  --accent-soft: #392D18; --plus: #6FC08C; --minus: #E5806F;
  --iron: #B6C4CC; --iron-soft: #26313A; --art-bg: #0E100F; --scrim: rgb(0 0 0 / .6);
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font: 400 17px/1.45 var(--f-body);
  padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; }

.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
header.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; min-height: 56px; }
.back, .icon-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; flex: none;
}
.back svg, .icon-btn svg { width: 18px; height: 18px; }
.top h1 { font: 400 22px/1.15 var(--f-display); margin: 0; text-wrap: balance; }
.top .eyebrow { font: 600 11px/1 var(--f-data); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }

main .wrap { padding-block: 16px 24px; display: flex; flex-direction: column; gap: 22px; }

/* Home */
.hero { display: flex; flex-direction: column; gap: 6px; }
.hero h2 { font: 400 30px/1.1 var(--f-display); margin: 0; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); max-width: 60ch; }
.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px;
}
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input {
  border: 0; background: transparent; width: 100%; padding-block: 12px; outline: none; min-width: 0;
}
.group { display: flex; flex-direction: column; gap: 8px; }
.group > h3, .sec-title {
  font: 600 12px/1 var(--f-data); letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); margin: 0;
}
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile {
  text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px;
  box-shadow: var(--shadow); min-width: 0;
}
.tile:hover { border-color: var(--accent-bright); }
.tile b { font: 400 19px/1.15 var(--f-display); }
.tile span { color: var(--muted); font-size: 14px; line-height: 1.3; }
.tile .count { font: 600 12px/1 var(--f-data); color: var(--accent); margin-top: 6px; }
@media (max-width: 360px) { .tiles { grid-template-columns: 1fr; } }

/* Notes */
.note {
  border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px;
  color: var(--muted); font-size: 15px; background: var(--surface);
}
.note b { color: var(--fg); }
.draft {
  display: inline-block; font: 600 11px/1 var(--f-data); letter-spacing: .08em; text-transform: uppercase;
  background: var(--accent-soft); color: var(--accent); padding: 5px 7px; border-radius: 6px; margin-right: 6px;
}

/* Filters */
.filters { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 0; display: flex; flex-direction: column; gap: 8px; }
.frow { display: flex; align-items: center; gap: 8px; padding-left: 12px; min-width: 0; }
.frow > span { font: 600 10.5px/1 var(--f-data); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); width: 54px; flex: none; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-right: 12px; min-width: 0; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
  padding: 6px 12px; font-size: 15px; cursor: pointer; white-space: nowrap; flex: none;
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.fmeta { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 2px 12px 0; border-top: 1px solid var(--line); padding-top: 10px; }
.fmeta small { color: var(--muted); font-size: 14px; }
.fmeta select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 8px; font-size: 15px; max-width: 60%; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 4px 0; font-size: 15px; }

/* Item cards */
.list { display: flex; flex-direction: column; gap: 8px; }
.item {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow);
}
.item-head { display: flex; align-items: flex-start; gap: 12px; }
.item-head .grow { flex: 1; min-width: 0; }
.item-head h4 { margin: 0; font: 400 20px/1.15 var(--f-display); }
.item-head .sub { color: var(--muted); font-size: 14px; margin-top: 3px; }
.thumb {
  width: 76px; height: 76px; border-radius: 10px; overflow: hidden; flex: none;
  background: var(--art-bg); border: 1px solid var(--line); padding: 0; cursor: zoom-in;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.price { text-align: right; flex: none; }
.price b { font: 600 20px/1 var(--f-data); color: var(--accent); font-variant-numeric: tabular-nums; }
.price b small { font-size: 13px; font-weight: 400; margin-left: 2px; }
.price div { font: 400 12px/1.2 var(--f-data); color: var(--muted); margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: 10px; overflow: hidden; margin: 0; }
.stats div { background: var(--sunk); padding: 8px 10px; min-width: 0; }
.stats dt { font: 600 10px/1 var(--f-data); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stats dd { margin: 4px 0 0; font: 600 15px/1.2 var(--f-data); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 13.5px; line-height: 1; padding: 6px 8px; border-radius: 6px; background: var(--iron-soft); color: var(--iron); }
.tag.warn { background: color-mix(in srgb, var(--minus) 14%, transparent); color: var(--minus); }
.tag.good { background: color-mix(in srgb, var(--plus) 14%, transparent); color: var(--plus); }
.tag.amber { background: var(--accent-soft); color: var(--accent); }
.item p { margin: 0; color: var(--muted); font-size: 15px; }
.item p b { color: var(--fg); font-weight: 500; }

.cat-head { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.cat-head h3 { margin: 0; font: 400 24px/1.1 var(--f-display); }
.cat-head p { margin: 0; color: var(--muted); font-size: 15px; }
.cat-head .rule { font: 400 13px/1.4 var(--f-data); color: var(--iron); }

dl.gloss { margin: 0; display: flex; flex-direction: column; gap: 10px; }
dl.gloss dt { font-weight: 700; }
dl.gloss dd { margin: 2px 0 0; color: var(--muted); font-size: 15px; }

/* Tables */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
th { font: 600 11px/1.2 var(--f-data); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--sunk); white-space: nowrap; }
td.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.strong { font-weight: 700; }

/* Races */
.pm { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: 15px; }
.pm li { display: grid; grid-template-columns: 16px 1fr; gap: 6px; }
.pm li::before { font: 700 15px/1.45 var(--f-data); }
.pm.plus li::before { content: "+"; color: var(--plus); }
.pm.minus li::before { content: "−"; color: var(--minus); }
.badge { font: 600 12px/1 var(--f-data); padding: 6px 8px; border-radius: 6px; white-space: nowrap; flex: none; }
.badge.low { background: color-mix(in srgb, var(--plus) 14%, transparent); color: var(--plus); }
.badge.high { background: color-mix(in srgb, var(--minus) 14%, transparent); color: var(--minus); }
.badge.cls { background: var(--accent-soft); color: var(--accent); }

/* Monsters */
details.mon { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
details.mon summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
details.mon summary::-webkit-details-marker { display: none; }
.face { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; flex: none; background: var(--art-bg); border: 2px solid var(--line); }
.face img { width: 100%; height: 100%; object-fit: cover; display: block; }
details.mon summary h4 { margin: 0; font: 400 20px/1.15 var(--f-display); }
details.mon summary .tags { margin-top: 6px; }
.chev { margin-left: auto; width: 20px; height: 20px; color: var(--muted); transition: transform .2s; flex: none; }
details.mon[open] .chev { transform: rotate(180deg); }
.mon-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
details.mon details.spawn { border: 1px dashed var(--line); border-radius: 10px; }
details.mon details.spawn summary { display: block; padding: 8px 12px; font-weight: 600; color: var(--muted); }
details.mon details.spawn summary::before { content: "▸ "; }
details.mon details.spawn[open] summary::before { content: "▾ "; }
details.mon details.spawn p { margin: 0; padding: 0 12px 10px; }
.full-art { background: var(--art-bg); border-radius: 12px; overflow: hidden; display: flex; justify-content: center; }
.full-art img { width: 100%; max-width: 300px; display: block; }
.abil { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; text-align: center; margin: 0; }
.abil div { background: var(--sunk); border-radius: 8px; padding: 6px 2px; }
.abil dt { font: 600 10px/1 var(--f-data); color: var(--muted); letter-spacing: .08em; }
.abil dd { margin: 4px 0 0; font: 600 14px/1.1 var(--f-data); }
.abil dd small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; margin-top: 2px; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 15px; }
.ess { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 8px; }
.ess h5 { margin: 0; font: 400 17px/1.2 var(--f-display); color: var(--accent); }
.ess p { margin: 0; color: var(--muted); font-size: 15px; }
.ess p b { color: var(--fg); font-weight: 500; }

/* Character: paper doll */
.char-top { display: flex; align-items: center; gap: 10px; }
.char-top .grow { flex: 1; min-width: 0; }
.char-top h2 { margin: 0; font: 400 26px/1.1 var(--f-display); }
.char-top .sub { color: var(--muted); font-size: 15px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer;
}
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.doll { display: grid; grid-template-columns: 72px minmax(0, 1fr) 72px; grid-auto-rows: 72px; gap: 8px; }
.slot {
  position: relative; border: 1.5px dashed var(--line); background: var(--surface); border-radius: 12px;
  cursor: pointer; padding: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-width: 0;
}
.slot.filled { border-style: solid; border-color: color-mix(in srgb, var(--accent-bright) 55%, var(--line)); background: var(--art-bg); }
.slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slot .lbl {
  position: relative; font: 600 9.5px/1.1 var(--f-data); letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
  text-align: center; padding: 0 3px;
}
.slot.filled .lbl {
  position: absolute; left: 0; right: 0; bottom: 0; color: #f3efe4; padding: 10px 3px 4px;
  background: linear-gradient(transparent, rgb(0 0 0 / .78));
}
.slot svg { width: 26px; height: 26px; color: var(--muted); opacity: .7; }
.slot .custom { position: relative; font-size: 12.5px; line-height: 1.15; color: #f3efe4; text-align: center; padding: 4px; overflow-wrap: anywhere; }
.slot.two { border-color: var(--accent-bright); }
.slot .two-tag {
  position: absolute; top: 4px; left: 4px; right: 4px; font: 600 9px/1 var(--f-data); color: #1d221f; background: #e8b355;
  border-radius: 4px; padding: 3px 2px; text-align: center; letter-spacing: .04em;
}
.portrait { grid-column: 2; grid-row: 1 / 6; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.portrait .frame {
  position: relative; border-radius: 14px; overflow: hidden; background: var(--art-bg);
  border: 2px solid color-mix(in srgb, var(--accent-bright) 60%, var(--line)); aspect-ratio: 4 / 5; max-width: 100%;
}
.portrait .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.portrait .plate {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; text-align: center; color: #f3efe4;
  background: linear-gradient(transparent, rgb(0 0 0 / .8)); font: 400 15px/1.1 var(--f-display);
}
.vitals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; flex: 1; align-content: start; }
.vitals div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 4px; text-align: center; min-width: 0; }
.vitals dt { font: 600 9.5px/1 var(--f-data); letter-spacing: .08em; color: var(--muted); }
.vitals dd { margin: 4px 0 0; font: 600 17px/1 var(--f-data); font-variant-numeric: tabular-nums; }
.vitals .wide { grid-column: 1 / -1; }
.vitals .wide dd { font-size: 13px; }

.statgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .k { font: 600 11px/1 var(--f-data); letter-spacing: .1em; color: var(--muted); }
.stat .v { display: flex; align-items: baseline; gap: 6px; }
.stat .v b { font: 600 26px/1.1 var(--f-data); font-variant-numeric: tabular-nums; }
.stat .v span { font: 600 14px/1 var(--f-data); color: var(--muted); }
.stat .src { font: 400 11.5px/1.35 var(--f-data); color: var(--muted); }
.stat .src .e { color: var(--accent); font-weight: 600; }
.stat .src .e.neg { color: var(--minus); }
.stat.boosted { border-color: color-mix(in srgb, var(--accent-bright) 60%, var(--line)); }
@media (max-width: 380px) { .statgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.ability { display: flex; flex-direction: column; gap: 4px; }
.ability h5 { margin: 0; font: 400 17px/1.2 var(--f-display); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ability h5 small { font: 600 11px/1 var(--f-data); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.ability p { margin: 0; color: var(--muted); font-size: 15px; }
.ability + .ability { border-top: 1px solid var(--line); padding-top: 10px; }
.warnline { color: var(--minus); font-size: 15px; margin: 0; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg);
  border-radius: 18px 18px 0 0; max-height: 86vh; overflow-y: auto; border-top: 1px solid var(--line);
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
.sheet .wrap { display: flex; flex-direction: column; gap: 12px; padding-block: 14px 0; }
.sheet-head { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; background: var(--bg); padding-block: 4px; z-index: 1; }
.sheet-head h3 { margin: 0; font: 400 22px/1.15 var(--f-display); flex: 1; }
.pick { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; cursor: pointer; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.pick[aria-pressed="true"] { border-color: var(--accent-bright); box-shadow: inset 0 0 0 1px var(--accent-bright); }
.pick img { width: 52px; height: 52px; border-radius: 8px; flex: none; background: var(--art-bg); }
.pick .grow { flex: 1; min-width: 0; }
.pick b { display: block; font-weight: 700; }
.pick small { color: var(--muted); font-size: 13.5px; }
.pick .p { font: 600 14px/1 var(--f-data); color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font: 600 11px/1 var(--f-data); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field input, .field select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 10px; width: 100%; min-width: 0; }
.row { display: flex; gap: 8px; align-items: flex-end; }
.row > * { flex: 1; min-width: 0; }
.statedit { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.check { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent-bright); }
.bigart { background: var(--art-bg); border-radius: 14px; overflow: hidden; }
.bigart img { width: 100%; display: block; }

/* Search results */
.result { text-align: left; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.result small { color: var(--muted); font-family: var(--f-data); font-size: 12px; white-space: nowrap; }
.empty { color: var(--muted); padding: 12px 0; text-align: center; }

/* Кубики: кнопка над нижним меню, видна на всех экранах (и поверх боя) */
.dice-fab { position: fixed; z-index: 40; right: max(14px, env(safe-area-inset-right, 0px));
  bottom: calc(74px + env(safe-area-inset-bottom, 0px)); width: 54px; height: 54px; padding: 4px; border-radius: 50%;
  border: 1px solid #6e5634; background: radial-gradient(circle at 40% 35%, #3a2c1a, #120e09); box-shadow: 0 4px 14px rgb(0 0 0 / .55); cursor: pointer; }
body.forge-open .dice-fab { display: none; }
.dice-fab svg { width: 100%; height: 100%; display: block; }
.dice-fab:focus-visible { outline: 2px solid #f0c979; outline-offset: 2px; }
#diceov, #saveov { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / .72); display: flex; align-items: flex-end; justify-content: center; color: var(--fx-text); color-scheme: dark;
  padding: env(safe-area-inset-top, 0px) max(0px, env(safe-area-inset-right, 0px)) 0 max(0px, env(safe-area-inset-left, 0px)); }
#diceov[hidden], #saveov[hidden] { display: none; }
.dice-sheet { width: min(520px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box; background: linear-gradient(#211910, #120e09); border: 1px solid var(--fx-line); border-bottom: 0;
  border-radius: 14px 14px 0 0; padding: 14px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.dice-sheet .ph-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dice-sheet h3 { margin: 0; font: 400 22px/1.1 var(--f-display); color: var(--fx-gold-hi); }
.dice-types { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.dice-types .fx-btn { padding: 9px 0; font: 600 14px var(--f-data); }
.dice-types .fx-btn.on, .dice-count .fx-btn.on { background: var(--fx-gold); color: #1d140a; border-color: var(--fx-gold-hi); }
.dice-count { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--fx-muted); font-size: 14px; }
.dice-count .fx-btn { width: 40px; height: 36px; padding: 0; font: 600 15px var(--f-data); }
.dice-stage { min-height: 150px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; padding: 8px 0; cursor: pointer; border-radius: 10px;
  background: radial-gradient(circle at 50% 40%, rgb(214 166 76 / .12), transparent 70%); }
.die { position: relative; width: 96px; height: 96px; display: grid; place-items: center; }
.dice-stage.many .die { width: 72px; height: 72px; }
.die svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.die b { position: relative; font: 400 34px/1 var(--f-display); color: #fff1c4; text-shadow: 0 2px 6px rgb(0 0 0 / .8); font-variant-numeric: tabular-nums; }
.dice-stage.many .die b { font-size: 26px; }
.die.crit svg path:first-child { fill: #6b4a12; stroke: #ffe39a; }
.die.fail svg path:first-child { fill: #5a1a12; stroke: #ff8a6a; }
.die.rolling { animation: die-spin .75s cubic-bezier(.2,.7,.3,1); }
@keyframes die-spin { 0% { transform: rotate(0) scale(.6); } 60% { transform: rotate(600deg) scale(1.12); } 100% { transform: rotate(720deg) scale(1); } }
@media (prefers-reduced-motion: reduce) { .die.rolling { animation: none; } }
.dice-total { text-align: center; color: var(--fx-muted); font-size: 15px; min-height: 22px; }
.dice-total b { color: var(--fx-gold-hi); font: 600 22px var(--f-data); }
.upd-box { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.upd-btn { font-size: 13.5px; padding: 7px 14px; }
.upd-note { color: var(--fx-muted); font-size: 12.5px; text-align: center; max-width: 300px; }
.save-list { display: flex; flex-direction: column; gap: 8px; }
.save-row { border: 1px solid var(--fx-line); border-radius: 8px; padding: 10px 12px; background: rgb(0 0 0 / .25); display: flex; flex-direction: column; gap: 6px; }
.save-row b { font: 400 18px/1.15 var(--f-display); color: var(--fx-gold-hi); }
.save-row small { color: var(--fx-muted); font-size: 13px; }
.save-row .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.save-row .btns .fx-btn { font-size: 13.5px; padding: 7px 12px; }
.save-note { color: var(--fx-muted); font-size: 13px; margin: 0; }

/* Tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabs .wrap { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding-block: 6px; }
nav.tabs button {
  border: 0; background: none; cursor: pointer; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px;
  font-size: 12.5px; color: var(--muted);
}
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs button[disabled] { opacity: .5; cursor: default; }
nav.tabs button small { font: 600 9px/1 var(--f-data); letter-spacing: .08em; text-transform: uppercase; }

/* ===== Fantasy screens ===== */
body.fx-page { background: radial-gradient(ellipse at 50% -10%, #3A2B1A 0%, var(--fx-bg) 55%) fixed, var(--fx-bg); color: var(--fx-text); }
body.fx-page::before { background: var(--fx-bg); }
body.fx-page header.top { display: none; }
body.forge-open { overflow: hidden; }

.fx-btn {
  font: 700 17px/1.1 var(--f-fancy); letter-spacing: .05em; color: var(--fx-gold-hi); cursor: pointer;
  background: linear-gradient(#3A2C1C, #231910); border: 1px solid var(--fx-gold); border-radius: 4px; padding: 9px 14px;
  box-shadow: inset 0 0 0 2px var(--fx-bg), inset 0 0 0 3px rgb(214 166 76 / .35), 0 2px 8px rgb(0 0 0 / .45);
  white-space: nowrap;
}
.fx-btn.primary { color: var(--fx-ink); background: linear-gradient(#ECC679, #B3812F); border-color: var(--fx-gold-hi);
  box-shadow: inset 0 0 0 2px #7A5418, inset 0 1px 0 3px rgb(255 240 200 / .35), 0 3px 12px rgb(0 0 0 / .5); }
.fx-btn.big { font-size: 22px; padding: 16px 30px; min-width: min(280px, 100%); }
.fx-btn:disabled { opacity: .4; cursor: default; }
.fx-btn:focus-visible { outline: 2px solid var(--fx-gold-hi); outline-offset: 3px; }

.fx-frame {
  position: relative; background: linear-gradient(180deg, var(--fx-panel2), var(--fx-panel));
  border: 1px solid var(--fx-line); border-radius: 6px; color: var(--fx-text);
  box-shadow: inset 0 0 0 3px var(--fx-panel), inset 0 0 0 4px rgb(214 166 76 / .25), 0 4px 14px rgb(0 0 0 / .35);
}
.fx-frame::before, .fx-frame::after {
  content: ""; position: absolute; left: 50%; width: 8px; height: 8px; margin-left: -4px;
  background: var(--fx-gold); transform: rotate(45deg); box-shadow: 0 0 6px rgb(244 212 142 / .5);
}
.fx-frame::before { top: -5px; } .fx-frame::after { bottom: -5px; }
.fx-rule { position: relative; height: 1px; width: min(240px, 80%); margin: 2px auto;
  background: linear-gradient(90deg, transparent, var(--fx-gold), transparent); }
.fx-rule span { position: absolute; left: 50%; top: -4px; width: 9px; height: 9px; margin-left: -4.5px; background: var(--fx-gold); transform: rotate(45deg); }
.fx-eyebrow { font: 700 14px/1 var(--f-fancy); letter-spacing: .22em; color: var(--fx-gold); text-transform: uppercase; }

.fx-home { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding-block: 24px 8px; }
.fx-home .crest svg { width: 132px; height: 132px; display: block; filter: drop-shadow(0 0 18px rgb(240 180 67 / .25)); }
.fx-title { margin: 0; font: 400 38px/1.05 var(--f-display); color: var(--fx-text); text-wrap: balance; text-shadow: 0 0 22px rgb(240 180 67 / .25); }
.fx-sub { margin: 0; color: var(--fx-muted); max-width: 34ch; }
.fx-hint { margin: 0; color: var(--fx-muted); font-size: 15px; font-style: italic; }
.fx-card { width: 100%; padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.fx-card h3 { margin: 0; font: 400 20px/1.15 var(--f-display); color: var(--fx-gold-hi); }
.fx-card p { margin: 0; color: var(--fx-muted); font-size: 15px; }
.fx-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fx-chip { border: 1px solid var(--fx-line); border-radius: 999px; padding: 5px 10px; font-size: 14px; background: rgb(0 0 0 / .25); }

#forge { position: fixed; inset: 0; z-index: 30; overflow-y: auto; overscroll-behavior: contain; color: var(--fx-text); color-scheme: dark; scrollbar-color: var(--fx-line) transparent;
  background: radial-gradient(ellipse at 50% 0%, #3A2B1A 0%, var(--fx-bg) 60%), var(--fx-bg); }
.fx-bar { position: sticky; top: 0; z-index: 2; border-bottom: 1px solid var(--fx-line);
  background: linear-gradient(var(--fx-bg2), rgb(21 17 12 / .94)); padding-top: env(safe-area-inset-top, 0px); }
.fx-bar .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding-block: 10px; min-height: 62px; }
.fx-bar .l { justify-self: start; } .fx-bar .r { justify-self: end; }
.fx-bar .c { text-align: center; display: flex; flex-direction: column; gap: 3px; }
.fx-bar .c small { font: 700 12px/1 var(--f-fancy); letter-spacing: .18em; color: var(--fx-gold); }
.fx-bar .c b { font: 400 21px/1.1 var(--f-display); font-weight: 400; }
.fx-bar .fx-btn { font-size: 15px; padding: 8px 12px; }
.fx-body .wrap { display: flex; flex-direction: column; gap: 18px; padding-block: 18px 28px; }
.fx-h { margin: 0; font: 400 27px/1.15 var(--f-display); text-align: center; text-wrap: balance; }
.fx-p { margin: 0; color: var(--fx-muted); text-align: center; }
.fx-section { font: 700 14px/1 var(--f-fancy); letter-spacing: .18em; color: var(--fx-gold); text-align: center; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
.fx-section::before, .fx-section::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--fx-line)); }
.fx-section::after { background: linear-gradient(90deg, var(--fx-line), transparent); }

.race-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
@media (min-width: 560px) { .race-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.race-card { cursor: pointer; padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 8px; text-align: left; font: inherit; min-width: 0; }
.race-card[aria-pressed="true"] { border-color: var(--fx-gold-hi);
  box-shadow: inset 0 0 0 3px var(--fx-panel), inset 0 0 0 4px var(--fx-gold-hi), 0 0 20px rgb(244 212 142 / .35); }
.ph { position: relative; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 4px; overflow: hidden; border: 1px solid var(--fx-line); background: #0F0C08; }
.ph svg, .ph img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ph .tick { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%; background: var(--fx-gold-hi); color: var(--fx-ink); display: grid; place-items: center; }
.ph .tick svg { width: 16px; height: 16px; }
.race-card h3 { margin: 0; font: 400 20px/1.1 var(--f-display); text-align: center; color: var(--fx-gold-hi); }
.bonus-box { background: rgb(0 0 0 / .28); border: 1px dashed var(--fx-line); border-radius: 4px; padding: 7px 8px; font-size: 13.5px; line-height: 1.35; }
.bonus-box .st { font: 600 12px/1.3 var(--f-data); color: var(--fx-gold); }
.bonus-box ul { margin: 4px 0 0; padding-left: 14px; color: var(--fx-muted); display: grid; gap: 2px; }

.fx-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fx-field > label, .fx-label { font: 700 13px/1 var(--f-fancy); letter-spacing: .14em; color: var(--fx-gold); text-transform: uppercase; }
.fx-input { width: 100%; min-width: 0; background: #120E09; border: 1px solid var(--fx-line); color: var(--fx-text); border-radius: 4px; padding: 11px 12px; font: 400 17px/1.2 var(--f-body); }
.fx-input:focus { outline: none; border-color: var(--fx-gold-hi); box-shadow: 0 0 0 2px rgb(244 212 142 / .25); }
.fx-input::placeholder { color: #7D6C52; }
.fx-input.bad { border-color: var(--fx-danger); }
.fx-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fx-seg .fx-btn[aria-pressed="false"] { color: var(--fx-muted); }
.fx-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 10px; }
.fx-stat { padding: 10px 8px 8px; text-align: center; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fx-stat .k { font: 700 13px/1 var(--f-fancy); letter-spacing: .14em; color: var(--fx-gold); }
.fx-stat input { text-align: center; font: 600 24px/1 var(--f-data); padding: 8px 4px; }
.fx-stat .note-s { font-size: 11.5px; line-height: 1.2; color: var(--fx-muted); margin-top: -2px; }
.stat-help { padding: 10px 14px 12px; }
.stat-help summary { cursor: pointer; font: 700 14px/1.2 var(--f-fancy); letter-spacing: .08em; color: var(--fx-gold); }
.stat-help dl { margin: 10px 0 0; display: grid; gap: 8px; }
.stat-help dt { font: 400 16px/1.2 var(--f-display); color: var(--fx-gold-hi); }
.stat-help dd { margin: 2px 0 0; color: var(--fx-muted); font-size: 14px; line-height: 1.4; }
.stat-help p { margin: 10px 0 0; color: var(--fx-muted); font-size: 13.5px; }
.fx-stat small { font: 400 11.5px/1.2 var(--f-data); color: var(--fx-muted); min-height: 14px; }
.fx-stat small b { color: var(--fx-gold-hi); }
.fx-trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fx-errors { border: 1px solid var(--fx-danger); background: rgb(236 139 116 / .1); border-radius: 4px; padding: 10px 12px; color: var(--fx-danger); font-size: 15px; }
.fx-errors ul { margin: 4px 0 0; padding-left: 18px; }
.chosen { display: flex; align-items: center; gap: 12px; padding: 10px; }
.chosen .ph { width: 48px; flex: none; }
.chosen b { font: 400 20px/1.1 var(--f-display); color: var(--fx-gold-hi); display: block; }
.chosen span { color: var(--fx-muted); font-size: 14px; }

.team-row { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 10px 4px 18px; scrollbar-width: thin; }
.member { flex: 0 0 170px; scroll-snap-align: start; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.member .nm { border: 1px solid var(--fx-gold); background: #120E09; border-radius: 3px; padding: 8px 6px; text-align: center;
  font: 400 19px/1.15 var(--f-display); color: var(--fx-gold-hi); overflow-wrap: anywhere; box-shadow: inset 0 0 0 2px #120E09, inset 0 0 0 3px rgb(214 166 76 / .3); }
.member dl { margin: 0; display: grid; gap: 4px; font-size: 14.5px; }
.member dl div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted rgb(110 86 52 / .6); padding-bottom: 3px; }
.member dt { color: var(--fx-muted); }
.member dd { margin: 0; text-align: right; }
.add-member { flex: 0 0 120px; scroll-snap-align: start; border: 2px dashed var(--fx-line); border-radius: 6px; background: rgb(0 0 0 / .2);
  color: var(--fx-gold); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font: 700 15px/1.1 var(--f-fancy); letter-spacing: .06em; }
.add-member svg { width: 46px; height: 46px; }
.add-member:hover { border-color: var(--fx-gold); }
.fx-footer { position: sticky; bottom: 0; padding: 16px 0 calc(16px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(transparent, var(--fx-bg) 35%); display: flex; justify-content: center; }

/* ===== Town ===== */
.town-head { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding-top: 8px; }
.town-head h2 { margin: 0; font: 400 32px/1.05 var(--f-display); color: var(--fx-text); }
.town-head p { margin: 0; color: var(--fx-muted); font-size: 15px; max-width: 36ch; }
.town-map { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 14px;
  border: 1px solid var(--fx-line); border-radius: 8px;
  background: radial-gradient(circle at 50% 50%, rgb(240 180 67 / .14), transparent 45%),
    repeating-linear-gradient(0deg, rgb(255 255 255 / .02) 0 1px, transparent 1px 22px),
    repeating-linear-gradient(90deg, rgb(255 255 255 / .02) 0 1px, transparent 1px 22px), #1B150E;
  box-shadow: inset 0 0 0 3px #1B150E, inset 0 0 0 4px rgb(214 166 76 / .25), inset 0 0 40px rgb(0 0 0 / .6); }
.bld { position: relative; cursor: pointer; padding: 6px 6px 8px; display: flex; flex-direction: column; gap: 6px; align-items: stretch;
  text-align: center; font: inherit; color: var(--fx-text); min-width: 0; }
.bld .art { aspect-ratio: 1; max-width: 100%; border-radius: 4px; overflow: hidden; border: 1px solid var(--fx-line); background: #0F0C08; position: relative; }
.bld .art svg { display: block; width: 100%; height: 100%; }
.bld b { font: 700 13.5px/1.15 var(--f-fancy); letter-spacing: .04em; color: var(--fx-gold-hi); overflow-wrap: break-word; }
.bld .gate-st { color: var(--fx-muted); font-size: 11.5px; text-align: center; }
.bld.shut .art { filter: grayscale(.8) brightness(.7); animation: none; }
.bld.locked { cursor: not-allowed; filter: grayscale(1) brightness(.62); }
.bld.locked b { color: var(--fx-muted); }
.bld .lock { position: absolute; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / .35); }
.bld .lock svg { width: 26px; height: 26px; color: #d8d0c0; }
.bld.gate { border-color: var(--fx-gold-hi);
  box-shadow: inset 0 0 0 3px var(--fx-panel), inset 0 0 0 4px var(--fx-gold-hi), 0 0 22px rgb(240 180 67 / .45); }
@media (prefers-reduced-motion: no-preference) {
  .bld.gate .art { animation: gatePulse 2.6s ease-in-out infinite; }
  @keyframes gatePulse { 50% { box-shadow: 0 0 18px rgb(240 180 67 / .55); } }
}
.town-note { text-align: center; color: var(--fx-muted); font-size: 14.5px; font-style: italic; margin: 0; }
.fx-toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40;
  max-width: calc(100% - 32px); background: var(--fx-panel2); color: var(--fx-text); border: 1px solid var(--fx-gold); border-radius: 6px;
  padding: 10px 14px; font-size: 15px; box-shadow: 0 6px 20px rgb(0 0 0 / .5); text-align: center; }
.gate-art { width: min(260px, 80%); aspect-ratio: 1; margin: 0 auto; border-radius: 8px; overflow: hidden; border: 1px solid var(--fx-line); }
.gate-art svg { display: block; width: 100%; height: 100%; }

/* ===== Dungeon ===== */
.dg { display: flex; flex-direction: column; gap: 12px; }
.dg-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.dg-clock { display: flex; flex-direction: column; gap: 4px; }
.dg-clock span { font: 700 12px/1 var(--f-fancy); letter-spacing: .16em; color: var(--fx-gold); text-transform: uppercase; }
.dg-clock b { font: 600 24px/1 var(--f-data); color: var(--fx-gold-hi); font-variant-numeric: tabular-nums; }
.dg-clock b small { font-size: 15px; color: var(--fx-muted); font-weight: 400; }
.dg-clock.r { align-items: flex-end; }
.dg-floor { display: flex; flex-direction: column; align-items: center; gap: 6px; font: 400 20px/1.1 var(--f-display); }
.dg-floor .fx-btn { padding: 2px 10px; font-size: 13px; }
.pips { display: flex; gap: 6px; }
.pips i { width: 9px; height: 9px; transform: rotate(45deg); border: 1px solid var(--fx-gold); display: block; }
.pips i.on { background: var(--fx-gold-hi); box-shadow: 0 0 6px rgb(244 212 142 / .6); }
.stage { position: relative; width: min(100%, 58vh); aspect-ratio: 1; margin: 0 auto; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--fx-line); background: radial-gradient(circle at 50% 50%, #2a2117, #0c0906 75%);
  box-shadow: inset 0 0 0 3px #0c0906, inset 0 0 0 4px rgb(214 166 76 / .25), inset 0 0 60px rgb(0 0 0 / .7);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.stage > svg { display: block; width: 100%; height: 100%; cursor: grab; }
.stage > svg:active { cursor: grabbing; }
.stage .tile-hit { cursor: pointer; }
.corner-btn { position: absolute; top: 8px; z-index: 4; height: 42px; padding: 0 10px; display: flex; align-items: center; gap: 6px; font-size: 14px; }
.corner-btn svg { width: 20px; height: 20px; flex: none; }
.corner-btn.l { left: 8px; } .corner-btn.r { right: 8px; }
.corner-btn.sq { width: 42px; padding: 0; justify-content: center; }
.corner-btn[aria-expanded="true"] { color: var(--fx-ink); background: linear-gradient(#ECC679, #B3812F); }
.zoom { position: absolute; right: 8px; bottom: 8px; z-index: 4; display: flex; flex-direction: column; gap: 6px; }
.zoom .fx-btn { width: 42px; height: 42px; padding: 0; font: 600 22px/1 var(--f-data); }
.phase-pill { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); z-index: 3; background: rgb(18 14 9 / .85);
  border: 1px solid var(--fx-gold); border-radius: 999px; padding: 6px 14px; font: 700 13px/1.1 var(--f-fancy); letter-spacing: .06em; color: var(--fx-gold-hi); white-space: nowrap; }
.dd { position: absolute; top: 58px; z-index: 5; padding: 10px; display: flex; gap: 10px; }
.dd.l { left: 8px; } .dd.r { right: 8px; flex-direction: column; align-items: stretch; min-width: 210px; }
.dd.r .fx-btn { font-size: 14px; padding: 8px 10px; }
.inv-item { position: relative; width: 70px; height: 78px; border-radius: 6px; border: 1px solid var(--fx-line); background: #120E09; color: var(--fx-gold-hi);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; padding: 0;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => n.toLocaleString("ru-RU");
const kg = n => fmt(Math.round(n * 10) / 10) + " кг";
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n);
const mod = s => Math.floor((s - 10) / 2);

function runs(price) {
  const r = price / SHARE_PER_RUN;
  if (r < 1) return "меньше захода";
  if (r < 10) {
    const v = Math.round(r * 10) / 10;
    return "≈ " + fmt(v) + (Number.isInteger(v) ? plural(v) : " захода");
  }
  const v = Math.round(r);
  return "≈ " + v + plural(v);
}
function plural(n) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return " заход";
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return " захода";
  return " заходов";
}
const avgDmg = d => { const m = /^(\d+)к(\d+)/.exec(d); return m ? m[1] * (+m[2] + 1) / 2 : 0; };
const isTwoHandedWeapon = w => w && w.props.includes("Двуручное");
const raceStatText = r => r.statText || STAT_KEYS.filter(k => r.mods[k]).map(k => `${signed(r.mods[k])} ${STAT_NAME[k]}`).join(", ");

const priceBlock = p => `<div class="price"><b>${fmt(p)}<small>з.</small></b><div>${runs(p)}</div></div>`;
const table = (head, rows, numCols = []) => `

  </table></div>`;
const chipRow = (label, key, options, current) => `

function filteredWeapons() {
  const list = WEAPONS.filter(w =>
    (wf.group === "all" || w.group === wf.group) &&
    (wf.hands === "all" || (w.kind !== "Боеприпасы" && (wf.hands === "two") === isTwoHandedWeapon(w))) &&
    (wf.kind === "all" || w.kind === wf.kind) &&
    (wf.dtype === "all" || w.type === wf.dtype));
  const by = {
    "price-asc": (a, b) => a.price - b.price, "price-desc": (a, b) => b.price - a.price,
    "dmg-desc": (a, b) => avgDmg(b.dmg) - avgDmg(a.dmg), "weight-asc": (a, b) => a.weight - b.weight,
    "name": (a, b) => a.name.localeCompare(b.name, "ru"),
  }[wf.sort];
  return list.sort(by);
}

function essenceBlock(e) {

        ${STAT_KEYS.filter(k => e.stats[k]).map(k => `<span class="tag ${e.stats[k] < 0 ? "warn" : "amber"}">${STAT_NAME[k]} ${signed(e.stats[k])}</span>`).join("")}

function renderBestiary() {
  const floors = [...new Set(MONSTERS.flatMap(m => m.floors))].sort((a, b) => a - b);
  const classes = [...new Set(MONSTERS.map(m => m.cls))].sort((a, b) => b - a);
  const list = MONSTERS.filter(m =>
    (mf.floor === "all" || m.floors.includes(+mf.floor)) &&
    (mf.cls === "all" || m.cls === +mf.cls) &&
    (mf.rank === "all" || rankOf(m) === mf.rank));
  const changed = JSON.stringify(mf) !== JSON.stringify(MF_DEFAULT);
  return `
    <div class="filters" data-scope="m">
      ${chipRow("Этаж", "floor", [["all", "Все"], ...floors.map(f => [f, f + " этаж"])], mf.floor)}
      ${chipRow("Класс", "cls", [["all", "Все"], ...classes.map(c => [c, c + " класс"])], mf.cls)}
      ${chipRow("Тип", "rank", [["all", "Все"], ...Object.entries(RANKS)], mf.rank)}
      <div class="fmeta"><small>Показано ${list.length} из ${MONSTERS.length}${changed ? ` · <button class="linkbtn" data-reset="m">Сбросить</button>` : ""}</small></div>
    </div>
    <div class="list">${list.length ? list.map(m => {
      const ab = m.abil ? STAT_KEYS.map((k, i) => [STAT_SHORT[k], m.abil[i]]) : null;
      return `
      <details class="mon" data-mon="${m.id}"${openMonsters.has(m.id) ? " open" : ""}>
        <summary>
          <span class="face">${img(ART.monsterFace(m.id), "Лицо: " + m.name)}</span>
          <div style="min-width:0">
            <h4>${m.name}</h4>
            <div class="tags"><span class="tag">${m.floors.join(", ")} этаж</span><span class="tag amber">${m.cls} класс</span><span class="tag${rankOf(m) === "normal" ? "" : " warn"}">${RANKS[rankOf(m)]}</span>${m.draft ? `<span class="tag warn">Черновик</span>` : ""}${m.statDraft ? `<span class="tag warn">Черновик статов</span>` : ""}</div>
          </div>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </summary>
        <div class="mon-body">
          <div class="full-art">${img(ART.monsterFull(m.id), m.name + " в полный рост")}</div>
          <p style="margin:0;color:var(--muted)">${m.size} · ${m.areas.join("; ")}</p>
          ${m.spawn ? `<details class="spawn"><summary>Условия появления</summary><p>${m.spawn}</p></details>` : ""}
          ${ab ? `<dl class="stats">
            <div><dt>КД</dt><dd>${m.ac}</dd></div>
            <div><dt>ОЗ</dt><dd>${m.hp}</dd></div>
            <div><dt>Скорость</dt><dd>${m.speed}</dd></div>
          </dl>
          <dl class="abil">${ab.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}<small>${signed(mod(v))}</small></dd></div>`).join("")}</dl>
          <p style="margin:0;color:var(--muted);font-size:15px">Опасность ${m.cr}. ${m.senses}</p>` : `<p style="margin:0;color:var(--muted);font-size:15px">Статблок ещё не расписан — пока утверждена только эссенция.</p>`}
          <ul class="plain">${m.traits.map(([n, t]) => `<li><b>${n}.</b> ${t}</li>`).join("")}</ul>
          <p style="margin:0;font-size:15px"><b>Добыча:</b> ${m.loot}</p>
          ${m.essence ? essenceBlock(ESSENCES[m.essence]) : ""}
        </div>
      </details>`; }).join("") : `<div class="empty">Таких монстров в каталоге пока нет.</div>`}
    </div>
    <div class="note">Монстры 9-го класса слабые и ходят группами: отряд 1-го уровня должен уверенно проходить стаю из 4–6. Стражи и лорды этажей появятся по мере утверждения.</div>`;
}

/* ----- цены эссенций (решение автора: 9 класс — 50 монет; остальные по отношению цен камней 1 : 5 : 20; наценка за редких и особых — черновик) ----- */

/* ----- доска объявлений: охота на монстров (черновик, drafts.md → «Доска, арена…») ----- */
// Каждое возвращение из лабиринта на доске появляются 2 задания. Принятое держится 2 захода (runs), после 2-го — последний шанс сдать в городе; при следующем спуске сгорает.

const TOWN_REV = 9, TOWN_FILES = ["assets/css/town.css", "assets/js/town.js"];

// Погибший герой уходит из отряда, его вещи (надетое и рюкзак) делятся между живыми (решение автора). Что не влезло — остаётся на теле.
function buryFallen() {
  const alive = state.party.filter(c => !c.dead), dead = state.party.filter(c => c.dead);

      <label class="check"><input type="checkbox" id="giant" ${char.giantGrip ? "checked" : ""}>
        <span><b>Держать одной рукой</b><br><small style="color:var(--muted)">«Великан»: −2 к атаке, вторая рука свободна</small></span></label>` : ""}
    ${opts.length ? opts.map(o => {
      const on = cur && cur.t === o.t && cur.id === o.it.id;
      const sub = o.t === "w" ? `${o.it.dmg} ${o.it.type}${isTwoHandedWeapon(o.it) ? " · двуручное" : ""}` : `КД ${o.it.ac} · ${o.it.catLabel}`;
      return `<button class="pick" data-equip="${id}" data-t="${o.t}" data-id="${o.it.id}" aria-pressed="${!!on}">
        ${img(o.art, o.it.name)}<span class="grow"><b>${o.it.name}</b><small>${sub}</small></span><span class="p">${fmt(o.it.price)} з.</span></button>`;
    }).join("") : `<div class="note">Предметов для слота «${s.label}» в справочнике пока нет. Можно вписать свой.</div>`}
    <div class="row">
      <div class="field"><label for="custom-name">Свой предмет</label><input id="custom-name" placeholder="Например: Амулет из клыка" autocomplete="off"></div>
      <button class="btn primary" data-custom="${id}" style="flex:none">Надеть</button>
    </div>`;
  openSheet(id === "main" && twoHanded() ? "Обе руки" : s.label, html);
}

function equip(id, val) {
  char.equip[id] = val;
  if (id === "main" && isTwoHandedWeapon(itemOf(val)) && !(char.giantGrip && char.race === "barbarian")) delete char.equip.off;
  char.example = false;
  saveChar();
  closeSheet();
  route();
}

      <div class="field"><label for="ed-age">Возраст</label><input id="ed-age" type="number" min="1" value="${char.age || ""}"></div>
    </div>
    <div class="row">
      <div class="field"><label for="ed-height">Рост, см</label><input id="ed-height" type="number" min="1" value="${char.height || ""}"></div>
      <div class="field"><label for="ed-weight">Вес, кг</label><input id="ed-weight" type="number" min="1" value="${char.weight || ""}"></div>
    </div>
    <div class="field"><label for="ed-race">Раса</label>
      <select id="ed-race">${RACES.map(r => `<option value="${r.id}"${r.id === char.race ? " selected" : ""}>${r.name} — ${raceStatText(r)}</option>`).join("")}</select></div>
    <div class="field"><label>Базовые характеристики (без расы и эссенций)</label>
      <div class="statedit">${STAT_KEYS.map(k => `
        <div class="field"><label for="ed-${k}">${STAT_SHORT[k]}</label><input id="ed-${k}" type="number" min="1" max="30" value="${char.base[k]}"></div>`).join("")}
      </div></div>
    <div class="field"><label>Эссенции</label>
      ${Object.values(ESSENCES).map(e => `
        <label class="check"><input type="checkbox" data-ess="${e.id}" ${char.essences.includes(e.id) ? "checked" : ""}>
          <span><b>${e.name}</b><br><small style="color:var(--muted)">${STAT_KEYS.filter(k => e.stats[k]).map(k => STAT_NAME[k] + " " + signed(e.stats[k])).concat(e.other).join(" · ")}</small></span></label>`).join("")}
    </div>
    <div class="row">
      ${char === state.example ? `<button class="btn" data-action="reset-char">Вернуть пример</button>` : ""}
      <button class="btn primary" data-action="save-char">Сохранить</button>
    </div>`;
  openSheet("Персонаж", html);
}

function saveEdit() {
  const v = id => document.getElementById(id).value;
  char.name = v("ed-name").trim();
  char.level = Math.min(20, Math.max(1, parseInt(v("ed-level"), 10) || 1));
  char.race = v("ed-race");
  char.gender = v("ed-gender") || null;
  for (const k of ["age", "height", "weight"]) { const n = parseInt(v("ed-" + k), 10); char[k] = n > 0 ? n : null; }
  if (char.race !== "barbarian") char.giantGrip = false;
  for (const k of STAT_KEYS) char.base[k] = Math.min(30, Math.max(1, parseInt(v("ed-" + k), 10) || 10));
  char.essences = [...document.querySelectorAll("[data-ess]")].filter(c => c.checked).map(c => c.dataset.ess);
  if (twoHanded()) delete char.equip.off;
  char.example = false;
  saveChar();
  closeSheet();
  route();
}

const $forge = document.getElementById("forge");

function openForge(step, mode) {

function closeForge() {
  forge = { open: false };

}

}

function statPreview(k) {
  const d = forge.draft, r = raceById(d.race), v = parseInt(d.base[k], 10), m = r.mods[k] || 0;

}

function renderForge(keepScroll) {
  const y = $forge.scrollTop;
  $forge.innerHTML = forge.step === "race" ? forgeRace() : forge.step === "weapon" ? forgeWeapon() : forge.step === "identity" ? forgeIdentity() : forgeTeam();
  $forge.hidden = false;
  $forge.scrollTop = keepScroll ? y : 0;
  if (forge.step === "team" && forge.scrollTeamEnd) {
    const row = document.getElementById("team-row");
    if (row) row.scrollLeft = row.scrollWidth;
    forge.scrollTeamEnd = false;
  }
}

function validateDraft() {
  const d = forge.draft, errs = [];
  if (!d.gender) errs.push({ f: "gender", m: "Выбери пол." });
  if (!d.name.trim()) errs.push({ f: "name", m: "Впиши имя героя." });
  const badStats = STAT_KEYS.filter(k => { const v = parseInt(d.base[k], 10); return !(v >= 1 && v <= 30); });
  badStats.forEach(k => errs.push({ f: k, m: `${STAT_NAME[k]}: число от 1 до 30.` }));
  for (const [k, l] of [["age", "Возраст"], ["height", "Рост"], ["weight", "Вес"]]) {
    if (d[k] !== "" && !(parseInt(d[k], 10) > 0)) errs.push({ f: k, m: `${l}: положительное число или пусто.` });
  }
  return errs;
}

function finishDraft() {
  forge.errors = validateDraft();
  if (forge.errors.length) { renderForge(); return; }
  const d = forge.draft, num = v => (parseInt(v, 10) > 0 ? parseInt(v, 10) : null);
  const c = {
    id: "c" + Date.now().toString(36), name: d.name.trim(), race: d.race, gender: d.gender, level: 1,
    age: num(d.age), height: num(d.height), weight: num(d.weight),
    base: Object.fromEntries(STAT_KEYS.map(k => [k, parseInt(d.base[k], 10)])),
    essences: [], giantGrip: false, kit: true,
    equip: { main: { t: "w", id: d.weapon }, body: { t: "g", id: "clothes" } }, bag: [],
  };
  const wpn = WEAPONS.find(x => x.id === d.weapon);
  if (d.knife && (wpn.props || []).includes("Лёгкое")) c.equip.off = { t: "w", id: wpn.id };                                   // два клинка вместо щита
  else if (d.shield && (d.race === "barbarian" || !(isTwoHandedWeapon(wpn) || wpn.group === "ranged"))) c.equip.off = { t: "w", id: "shield" };
  addToBag(c, { t: "g", id: "ration", qty: 7 });
  addToBag(c, { t: "g", id: "potion", qty: 2 });
  if (WEAPONS.find(x => x.id === d.weapon).group === "ranged") addToBag(c, { t: "g", id: "arrow", qty: QUIVER });          // колчан: 40 обычных стрел
  c.hp = maxHp(c);
  state.party.push(c);
  if (!state.current) state.current = c.id;
  saveChar();
  forge.step = "team"; forge.draft = null; forge.errors = []; forge.scrollTeamEnd = true;
  renderForge();
}

function completeTeam() {
  if (!state.party.length) return;
  state.sessions.push({ n: state.sessions.length + 1, date: new Date().toISOString(), members: state.party.map(c => c.id) });
  if (!state.party.some(c => c.id === state.current)) state.current = state.party[0].id;
  saveChar();
  closeForge();
  if (location.hash.slice(1) !== "town") location.hash = "town"; else route();
}

$forge.addEventListener("click", e => {
  const el = e.target.closest("[data-fx],[data-fx-race],[data-fx-gender],[data-fx-weapon],[data-fx-shield],[data-fx-knife],[data-fx-twin]");
  if (!el) return;
  const ds = el.dataset;
  if (ds.fxRace) { forge.draft.race = ds.fxRace; renderForge(true); return; }
  if (ds.fxWeapon) { forge.draft.weapon = ds.fxWeapon; forge.draft.knife = false; renderForge(true); return; }
  if (ds.fxShield !== undefined) { forge.draft.shield = !forge.draft.shield; renderForge(true); return; }
  if (ds.fxTwin !== undefined) { forge.draft.weapon = "dagger"; forge.draft.knife = true; forge.draft.shield = false; renderForge(true); return; }
  if (ds.fxKnife !== undefined) { forge.draft.knife = !forge.draft.knife; if (forge.draft.knife) forge.draft.shield = false; renderForge(true); return; }
  if (ds.fxGender) { forge.draft.gender = ds.fxGender; forge.errors = forge.errors.filter(x => x.f !== "gender"); renderForge(true); return; }
  switch (ds.fx) {
    case "next": if (forge.draft.race) { forge.step = "weapon"; renderForge(); } break;
    case "back-race": forge.step = "race"; renderForge(); break;
    case "next-w": if (forge.draft.weapon) { forge.step = "identity"; renderForge(); } break;
    case "back": forge.step = "weapon"; forge.errors = []; renderForge(); break;
    case "discard": forge.step = "team"; forge.draft = null; renderForge(); break;
    case "add": forge.mode = "more"; forge.step = "race"; forge.draft = newDraft(); forge.errors = []; renderForge(); break;
    case "finish": finishDraft(); break;
    case "complete": completeTeam(); break;
    case "close": closeForge(); break;
  }
});
$forge.addEventListener("input", e => {
  const t = e.target;
  if (!forge.draft) return;
  if (t.dataset.draft) { forge.draft[t.dataset.draft] = t.value; t.classList.remove("bad"); }
  if (t.dataset.draftStat) {
    const k = t.dataset.draftStat;
    forge.draft.base[k] = t.value; t.classList.remove("bad");
    const out = document.getElementById("fx-tot-" + k);
    if (out) out.innerHTML = statPreview(k);
  }
});

  const sq = (x, y, attrs) => `<rect x="${(x - px) * T - T / 2 + 2}" y="${(y - py) * T - T / 2 + 2}" width="${T - 4}" height="${T - 4}" rx="6" ${attrs}/>`;
  for (const k of r.visited) {
    const [x, y] = k.split(",").map(Number);
    if (x === px && y === py) continue;
    parts.push(sq(x, y, isDark(x, y) ? 'fill="#14100c" stroke="#3e3020" stroke-width="1.2"' : `fill="${tileFill(x, y)}" stroke="#6e5634" stroke-width="1.2"`));
    if (tileType(x, y) === "floor") parts.push(up((x - px) * T, (y - py) * T, `<g opacity="${isDark(x, y) ? .3 : 1}">${tileDeco(x, y)}</g>`));
    if (isDark(x, y)) parts.push(up((x - px) * T, (y - py) * T, ICON.moon));
    const ic = tileIcon(x, y);
    if (ic) parts.push(up((x - px) * T, (y - py) * T, `<g transform="scale(.85)">${ic}</g>`));
  }
  if (dgUi.phase === "move" || dgUi.phase === "run") {
    for (const p of dgUi.path) parts.push(sq(p.x, p.y, 'fill="rgb(244 212 142 / .18)" stroke="#f4d48e" stroke-width="2.4"'));
    for (const t of candidates().filter(t => inBounds(t.x, t.y))) {          // за краем карты клетку не рисуем: там просто пусто
      const known = inBounds(t.x, t.y) && vis.has(tkey(t.x, t.y));
      parts.push(`<g class="tile-hit" data-tx="${t.x}" data-ty="${t.y}">${sq(t.x, t.y, `fill="${known ? "rgb(214 166 76 / .14)" : "rgb(120 110 95 / .22)"}" stroke="#f4d48e" stroke-width="1.8" stroke-dasharray="6 5"`)}
        ${known ? "" : up((t.x - px) * T, (t.y - py) * T, `<text text-anchor="middle" dominant-baseline="central" font-family="Kelly Slab, Georgia, serif" font-size="22" fill="#f4d48e" opacity=".75">?</text>`)}</g>`);
    }
  }
  if (dgUi.phase === "move" || dgUi.phase === "run") {
    const ft = flameTarget(dgUi.phase === "run" && dgUi.path.length ? dgUi.path[0] : r.pos);
    if (ft && inBounds(ft.x, ft.y)) parts.push(up((ft.x - px) * T, (ft.y - py) * T, `<circle r="26" fill="url(#torchGlow)"/><g style="color:#f4b443" transform="translate(-14 -14) scale(1.15)" pointer-events="none">${ICO_FLAME}</g>`));
  }
  const darkHere = isDark(px, py) && !r.light;
  parts.push(sq(px, py, darkHere ? 'fill="#14100c" stroke="#f4d48e" stroke-width="2.5"' : `fill="${tileFill(px, py)}" stroke="#f4d48e" stroke-width="2.5"`));
  if (tileType(px, py) === "floor") parts.push(up(0, 0, `<g opacity="${darkHere ? .3 : 1}">${tileDeco(px, py)}</g>`));
  if (r.light) parts.push(`<circle r="${T * 1.6}" fill="url(#torchGlow)" pointer-events="none"/>`);
  const here = tileIcon(px, py);
  if (here) parts.push(up(0, 0, `<g transform="translate(-16 -16) scale(.6)">${here}</g>`));
  parts.push(up(0, 0, `<g transform="${here ? "translate(8 8) scale(.8)" : ""}">${ICON.party}</g>`));
  const half = T * 3.6;
  return `<svg viewBox="${-half} ${-half} ${half * 2} ${half * 2}" id="dg-svg" role="img" aria-label="Видимая часть этажа">
    <defs>${ICON_DEFS}</defs><g id="dg-rot" transform="rotate(${R}) scale(${dgUi.zoom})">${parts.join("")}</g></svg>`;
}

function charBars(c) {
  const st = state.run.status[c.id];
  const hungry = st.starve > 0, hungerDays = Math.floor(st.starve / 3);
  const satW = hungry ? 0 : Math.min(1, st.sat / 6), sleepW = Math.max(0, 1 - st.awake / 3);
  const deb = [];
  if (st.fat > 0) deb.push(`${FATIGUE[st.fat - 1][1]}: ${FATIGUE[st.fat - 1][2]}`);
  if (st.fat >= 4) deb.push("Обморок: спасбросок ТЕЛ в начале действия");
  if (hungerDays >= 1) deb.push("Голод: Отдых снимает на 1 уровень меньше");
  if (inDarkness()) deb.push(hasDarkvision(c) ? "Тьма: помеха на Восприятие (тёмное зрение)" : "Тьма: помеха на Восприятие, Поиск и дальние атаки, пассивное Восприятие −5, −2 к броску события");
  if (st.awake >= 3) deb.push(`Без сна ${Math.floor(st.awake / 3)} сут.`);
  const ld = load(c);
  if (ld.level !== "ok") deb.push(LOAD_TEXT[ld.level].split(":")[0] + (ld.noRun ? ", бег невозможен" : ""));
  else if (ld.noRun) deb.push("Перегруз: бег невозможен");
  return `<article class="pc fx-frame" data-hero="${c.id}" aria-label="${esc(c.name)}: удерживай, чтобы открыть меню">
    <div class="nm">${esc(c.name)}</div>
    ${hpMeter(c)}${mpMeter(c)}
    <div class="meter"><span>Голод</span><div class="bar" title="${hungry ? "без еды" : "сыт"}"><i class="${satW < .34 ? "low" : ""}" style="width:${Math.round(satW * 100)}%"></i></div></div>
    <div class="meter"><span>Сон</span><div class="bar"><i class="${sleepW < .34 ? "low" : ""}" style="width:${Math.round(sleepW * 100)}%"></i></div></div>
    <div class="meter"><span>Усталость</span><div class="segs">${[1, 2, 3, 4].map(n => `<i class="${st.fat >= n ? "on" : ""}"></i>`).join("")}</div></div>
    <ul class="debuffs">${deb.length ? deb.map(d => `<li>${d}</li>`).join("") : `<li class="ok">Бодр, без штрафов</li>`}</ul>
  </article>`;
}

const LUCK_TEXT = { supplies3: "три набора расходников", floorMap: "карта этажа", gear: "оружие или броня", magicMap: "магическая карта", two: "два приза" };
function rollPreview(p) {
  if (p.cause === "pass") return p.pick <= p.amb ? "Засада на бегу" : p.pick <= p.trap ? "Ловушка гоблинов" : "Пробежали без происшествий";

  const n = p.pick - (p.dark ? 2 : 0) - (p.blood ? 2 : 0); let ev = eventOf(Math.max(1, n), isRuins(p.x, p.y)); if (p.monsters && !MON_EVENTS.has(ev[1])) ev = eventOf(12); return ev[2];
}
function diceBlock(p) {

    else if (sr.pick && !needLuck) { const row = table.find(([max]) => sr.pick <= max); prev = row[1] === "stones" ? `камни ${row[2]}–${row[3]}` : SEARCH_ROWS_TEXT[row[1]]; }

}
