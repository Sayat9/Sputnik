function floorMapOverlay() {
  const S = 40, n = FL().size, cells = [];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    cells.push(`<rect x="${x * S + 1.5}" y="${y * S + 1.5}" width="${S - 3}" height="${S - 3}" rx="3" fill="${tileFill(x, y)}" stroke="#4e3d27"/>`);
    if (tileType(x, y) === "floor") cells.push(`<g transform="translate(${x * S + S / 2} ${y * S + S / 2}) scale(${S / T})" opacity="${isDark(x, y) ? .35 : 1}">${tileDeco(x, y)}</g>`);
    if (isDark(x, y)) cells.push(`<rect x="${x * S + 1.5}" y="${y * S + 1.5}" width="${S - 3}" height="${S - 3}" rx="3" fill="#000" opacity=".55" pointer-events="none"/>`);
    const ic = tileIcon(x, y);
    if (ic) cells.push(`<g transform="translate(${x * S + S / 2} ${y * S + S / 2}) scale(.95)">${ic}</g>`);
  }
  const magic = dgUi.map === "magic", pos = state.run.pos;
  if (magic) cells.push(`<g transform="translate(${pos.x * S + S / 2} ${pos.y * S + S / 2}) scale(.85)"><circle r="17" fill="none" stroke="#9ad0ff" stroke-width="2" opacity=".8"><animate attributeName="r" values="14;19;14" dur="1.6s" repeatCount="indefinite"/></circle>${ICON.party}</g>`);
  return `<div class="mapov" role="dialog" aria-modal="true" aria-label="Карта этажа">
    <div class="panel fx-frame">
      <div class="ph-head"><h3>${magic ? "Магическая карта" : "Карта"} ${curFloor()} этажа</h3>
        <button class="fx-btn" data-dg="close-map" aria-label="Закрыть карту" style="width:42px;height:42px;padding:0;display:grid;place-items:center">${ICO_X}</button></div>
      <svg class="floor" viewBox="-6 -22 ${n * S + 12} ${n * S + 28}">
        <defs>${ICON_DEFS}</defs>
        <text x="${n * S / 2}" y="-9" text-anchor="middle" font-family="Kelly Slab, Georgia, serif" font-size="14" fill="#e5806f">▲ С</text>
        ${cells.join("")}
      </svg>
      <p>${magic ? "Магическая карта: светящаяся метка — где отряд сейчас." : "Статуя в центре, порталы по углам; тёмные квадраты вокруг порталов — зоны тьмы. Где стоит отряд, карта не показывает."}</p>
    </div>
  </div>`;
}

/* ----- время, усталость, голод ----- */
function logRun(t) { const r = state.run; r.log.push({ d: r.day, a: r.act, t }); if (r.log.length > 40) r.log.shift(); }
function tileNote(x, y) {
  const t = tileType(x, y);
  if (t === "statue") return " Центр этажа: статуя у храма.";
  if (t === "portal") return ` ${portalName(x, y)}.`;
  return "";
}
// Одно действие ≈ 8 часов: тратится сытость, растёт время без сна.
// По rules.md: +1 Усталость за сутки без сна; со 2-х суток без еды +1 Усталость в сутки.
function tick(sleepers = new Set()) {
  for (const c of state.party) {
    const st = state.run.status[c.id];
    if (st.sat > 0) st.sat--;
    else { st.starve++; if (st.starve >= 6 && st.starve % 3 === 0) st.fat++; }
    if (!sleepers.has(c.id)) { st.awake++; if (st.awake % 3 === 0) st.fat++; }
    st.fat = Math.min(4, st.fat);
  }
}
function advanceTime() {
  const r = state.run;
  if (r.day >= FL().days && r.act >= FL().acts) { endRun(); return true; }
  r.act++; chaliceTick(1);
  if (r.act > FL().acts) { r.act = 1; r.day++; logRun(`Начался день ${r.day}.`); spDawn(); }
  return false;
}
function endRun(early) {
  const FL_DAYS = FL().days, st = state.run && state.run.status;
  if (st) for (const c of state.party) if (st[c.id]) c.carry = { ...st[c.id] };          // усталость и голод переходят в город и в следующий заход, пока их не снимет таверна
  const tc = townClock(); tc.back = true; tc.t0 = tc.t; tc.trips = (tc.trips || 0) + 1; questsAfterRun();
  state.run = null; state.runSnap = null;
  state.townUnlocked = true;
  dgUi = freshUi();
  saveChar();
  location.hash = "town";
  setTimeout(() => toast(early ? "Отряд вернулся в город." : FL_DAYS + " дней прошли: лабиринт выбросил отряд на Площадь измерений."), 50);
}
function visit(x, y) { const k = tkey(x, y); if (!state.run.visited.includes(k)) state.run.visited.push(k); }

// Еда общая, но лежит у каждого своя: герой сначала ест из своего рюкзака, потом берёт у того, у кого больше всего.
function eatRations(c, n) {
  let got = takeGear(c, "ration", n);
  while (got < n) {
    const donor = state.party.filter(o => o.id !== c.id && countGear(o, "ration") > 0).sort((a, b) => countGear(b, "ration") - countGear(a, "ration"))[0];
    if (!donor) break;
    got += takeGear(donor, "ration", n - got);
  }
  return got;
}

function act(kind) {
  const r = state.run; if (!r) return;
  if (kind === "move") {
    if (r.flame && r.flame.left > 0) r.flame.left--;
    const t = dgUi.target; r.pos = { x: t.x, y: t.y }; visit(t.x, t.y);
    r.stay = { k: tkey(t.x, t.y), since: absAct(r) + 1 };
    tick();
    logRun("Движение на 1 квадрат." + tileNote(t.x, t.y));
  } else if (kind === "run") {
    const tired = state.party.filter(c => r.status[c.id].fat >= 3).map(c => c.name);
    if (r.flame && r.flame.left > 0) r.flame.left--;
    const t = dgUi.path[dgUi.path.length - 1]; r.pos = { x: t.x, y: t.y };
    r.stay = { k: tkey(t.x, t.y), since: absAct(r) + 1 };
    dgUi.finFresh = !r.visited.includes(tkey(t.x, t.y));
    visit(t.x, t.y);                         // первый квадрат пробежали — он остаётся неоткрытым
    tick();
    for (const c of state.party) r.status[c.id].fat = Math.min(4, r.status[c.id].fat + 1);
    logRun("Бег на 2 квадрата: всем +1 Усталость, пассивное Восприятие −5." + tileNote(t.x, t.y)
      + (tired.length ? ` Спасбросок ТЕЛ Сл 12 перед Бегом: ${tired.join(", ")}.` : ""));
  } else if (kind === "sp") {
    tick();
    spDo(dgUi.spDo);
  } else if (kind === "explore" || kind === "dig") {
    tick();
    doSearch(kind);
  } else if (kind === "rest") {
    const rs = dgUi.rest; if (rs.ng && ngCharges() <= 0) rs.ng = false;
    const sleepers = new Set(state.party.filter(c => !rs.guard[c.id]).map(c => c.id));
    let eaten = 0;
    for (const c of state.party) {
      const n = rs.eat[c.id] || 0, st = r.status[c.id];
      const got = eatRations(c, n);
      if (got > 0) { st.sat = Math.min(9, st.sat + 3 * got); st.starve = 0; eaten += got; }
    }
    if (rs.flask && trReady("flask") && eaten > 0) {
      const hc = state.party.find(c => (rs.eat[c.id] || 0) > 0);
      if (hc) { addToBag(hc, { t: "g", id: "ration", qty: 1 }); cdSet("flask"); eaten--; logRun(`Фляга странника: один паёк возвращён ${hc.name}.`); }
    }
    tick(sleepers);
    for (const [cid, on] of Object.entries(rs.cup || {})) {                      // чаша: паёк превращается в воду, через 2 дня — зелье
      const c = state.party.find(x => x.id === cid), e = c && chalicesOf(c, "empty")[0];
      if (on && e && eatRations(c, 1) > 0) { chaliceFill(e); logRun(`${c.name} наполняет чашу здоровья, потратив паёк.`); }
    }
    const healed = [];
    for (const c of state.party) if (sleepers.has(c.id) && !c.dead) {            // погибший не лечится: его возвращает только мастер
      const st = r.status[c.id], before = hpOf(c);
      c.hp = Math.min(maxHp(c), before + restHeal(c, st.fat, st.starve >= 3));
      c.mp = maxMp(c); c.flags = {};                       // длинный отдых: мана и дневные способности
      c.insp = 1;                                          // переброс возвращает только сон
      if (c.hp > before) healed.push(`${c.name} +${c.hp - before}`);
      if (!stoneAt("lava")) st.fat = Math.max(0, st.fat - (st.starve >= 3 ? 1 : 2));          // «Жар» лавовых трещин: отдых не снимает Усталость
      st.awake = 0;
    }
    if (rs.hearth && !r.hearthUsed && treasure("hearth").owned) {
      r.hearthUsed = true;
      for (const c of state.party) if (!c.dead) { const st = r.status[c.id]; st.fat = 0; if (sleepers.has(c.id)) st.awake = 0; }
      logRun("Вечный очаг согревает лагерь: Усталость у всех снята до 0.");
    }
    const guards = state.party.filter(c => rs.guard[c.id]).map(c => c.name);
    if (rs.ng) { ngState().used++; logRun(`Отдых. Лагерь сторожит Ночной страж (осталось зарядов: ${ngCharges()}), ночной встречи нет. Съедено пайков: ${eaten}.${healed.length ? " ОЗ: " + healed.join(", ") + "." : ""}`); }
    else logRun(`Отдых. ${guards.length ? "В карауле: " + guards.join(", ") + ". Ночная встреча на 1 из к6." : "Без караула: встреча на 1–2 из к6, врасплох вся партия."} Съедено пайков: ${eaten}.${healed.length ? " ОЗ: " + healed.join(", ") + "." : ""}`);
  }
  if (kind === "move" || kind === "run") {
    const z = zoneAt(r.pos.x, r.pos.y);
    if (z.kind === "safe") logRun("Возле статуи монстры не появляются.");
    if (inDarkness()) logRun("Тьма: без света помеха на Восприятие и поиск, дальние атаки с помехой, −2 к броску события.");
    const p0 = kind === "run" && dgUi.path.length > 1 ? dgUi.path[0] : null;
    if (p0 && zoneAt(p0.x, p0.y).kind !== "safe" && !isQuiet(r, tkey(p0.x, p0.y))) askPass(p0.x, p0.y, { key: tkey(r.pos.x, r.pos.y), fresh: dgUi.finFresh });
    if (z.kind !== "safe" && spEnter()) { /* особое место: бой начат */ }
    else if (z.kind !== "safe") {
      if (isQuiet(r, tkey(r.pos.x, r.pos.y))) logRun("Квадрат недавно зачищен: пусто, бросок не нужен.");
      else { logRun("Новый квадрат: мастер, брось к20."); askRoll(kind); }
    }
  }
  if (kind === "rest") {
    const guarded = !!(dgUi.rest && dgUi.rest.ng) || state.party.some(c => dgUi.rest && dgUi.rest.guard[c.id]);
    rollEncounter(guarded ? "rest" : "rest-noguard", Math.max(0, ...state.party.filter(c => dgUi.rest && dgUi.rest.guard[c.id]).map(c => state.run.status[c.id].fat)));
  }
  // Факел горит 4 действия, пока зажжён.
  if (r.light) {
    r.torchLeft = (r.torchLeft || 0) - 1 - (stoneAt("lake") ? 1 : 0);          // «Сырость» озера: факел сгорает вдвое быстрее
    if (r.torchLeft <= 0) { r.light = false; r.torchLeft = 0; logRun("Факел догорел."); }
  }
  dgUi.phase = "menu"; dgUi.path = []; dgUi.rest = null; dgUi.target = null; dgUi.sr = null;
  if (advanceTime()) return;
  { const sp = spOf(); while (sp && sp.pen > 0) { sp.pen--; tick(); if (advanceTime()) return; } }          // паутина съела действие
  if (kind !== "move" && kind !== "run") campCheck();
  spAfter();
  saveChar();
  rerender();
}

/* ----- жесты, удержание и компас ----- */
let compassSim = { angle: 0, vel: 0, raf: 0, last: 0 };
function applyRotation() {
  const R = viewRot();
  const g = document.getElementById("dg-rot");
  if (!g) return;
  g.setAttribute("transform", `rotate(${R}) scale(${dgUi.zoom})`);
  g.querySelectorAll(".up").forEach(e => e.setAttribute("transform", `translate(${e.dataset.cx} ${e.dataset.cy}) rotate(${-R})`));
}
function compassLoop(ts) {
  const card = document.getElementById("ccard");
  if (!card || !state.run) { compassSim.raf = 0; return; }
  const dt = Math.min(0.05, (ts - (compassSim.last || ts)) / 1000) || 0.016;
  compassSim.last = ts;
  const target = viewRot();
  const diff = ((target - compassSim.angle) % 360 + 540) % 360 - 180;     // кратчайший путь
  const k = 38, c = 3.2;                                                    // пружина и вязкость: стрелка проскакивает и успокаивается
  compassSim.vel += (k * diff - c * compassSim.vel) * dt;
  compassSim.angle += compassSim.vel * dt;
  card.setAttribute("transform", `rotate(${compassSim.angle})`);
  compassSim.raf = requestAnimationFrame(compassLoop);
}
function startCompass(kick) {
  if (kick) { compassSim.angle = viewRot() + 150 + Math.random() * 60; compassSim.vel = 0; }
  if (!compassSim.raf) { compassSim.last = 0; compassSim.raf = requestAnimationFrame(compassLoop); }
}

let hold = null;
const HOLD_MS = 2000;
function startHold(id, btn) {
  const it = invItem(id);
  if (!it.owned) { toast(id === "compass" ? "Компаса нет. Его можно найти, исследуя фрагменты." : "Карты этого этажа нет. Её можно найти, исследуя и копая."); return; }
  if (it.active) return;
  cancelHold();
  const ring = btn.querySelector(`[data-ring="${id}"]`);
  hold = { id, t0: performance.now(), raf: 0, ring };
  const step = now => {
    if (!hold) return;
    const p = Math.min(1, (now - hold.t0) / HOLD_MS);
    hold.ring.setAttribute("stroke-dashoffset", String(100 - p * 100));
    if (p >= 1) {
      it.active = true; hold = null; dgUi.justLit = true; saveChar();
      setTimeout(() => { dgUi.justLit = false; }, 500);
      toast(id === "compass" ? "Компас ожил" : id === "mmap" ? "Магическая карта ожила" : "Карта развёрнута и готова");
      rerender(); return;
    }
    hold.raf = requestAnimationFrame(step);
  };
  hold.raf = requestAnimationFrame(step);
}
function cancelHold() {
  if (!hold) return;
  cancelAnimationFrame(hold.raf);
  hold.ring.setAttribute("stroke-dashoffset", "100");
  hold = null;
}
const clampZoom = z => Math.min(2.2, Math.max(0.45, z));

function mountDungeon() {
  const stage = document.getElementById("stage");
  const svg = document.getElementById("dg-svg");
  if (!stage || !svg) return;
  const pts = new Map();
  let drag = null, pinch = null;
  const center = () => { const b = svg.getBoundingClientRect(); return [b.left + b.width / 2, b.top + b.height / 2]; };
  const pinchInfo = () => { const [a, b] = [...pts.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y), ang: Math.atan2(b.y - a.y, b.x - a.x) }; };
  svg.addEventListener("pointerdown", e => {
    svg.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { pinch = { ...pinchInfo(), z: dgUi.zoom }; drag = null; return; }
    const [cx, cy] = center();
    drag = { x0: e.clientX, y0: e.clientY, a: Math.atan2(e.clientY - cy, e.clientX - cx), moved: false };
  });
  svg.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pts.size === 2) {
      const now = pinchInfo();
      dgUi.zoom = clampZoom(pinch.z * now.d / pinch.d);
      let d = (now.ang - pinch.ang) * 180 / Math.PI; d = ((d % 360) + 540) % 360 - 180;
      pinch.ang = now.ang; state.run.spin = (state.run.spin + d) % 360;
      applyRotation(); return;
    }
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) drag.moved = true;
    if (!drag.moved) return;
    const [cx, cy] = center();
    const a = Math.atan2(e.clientY - cy, e.clientX - cx);
    let d = (a - drag.a) * 180 / Math.PI;
    d = ((d % 360) + 540) % 360 - 180;
    drag.a = a;
    state.run.spin = (state.run.spin + d) % 360;
    applyRotation();
  });
  const end = e => {
    pts.delete(e.pointerId);
    if (pinch) { if (pts.size < 2) { pinch = null; saveChar(); } drag = null; return; }
    if (!drag) return;
    const wasDrag = drag.moved; drag = null;
    if (wasDrag) { saveChar(); return; }
    if (dgUi.phase !== "move" && dgUi.phase !== "run") return;
    const hit = document.elementFromPoint(e.clientX, e.clientY)?.closest("[data-tx]");
    if (!hit) return;
    const t = { x: +hit.dataset.tx, y: +hit.dataset.ty };
    if (!inBounds(t.x, t.y)) return;                       // стена: ничего не происходит
    if (dgUi.phase === "move") { dgUi.target = t; act("move"); return; }
    dgUi.path.push(t);
    if (dgUi.path.length >= 2) act("run"); else rerender();
  };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", e => { pts.delete(e.pointerId); drag = null; pinch = null; });

  stage.querySelectorAll("[data-inv]").forEach(btn => {
    btn.addEventListener("pointerdown", e => { e.preventDefault(); startHold(btn.dataset.inv, btn); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(t => btn.addEventListener(t, cancelHold));
    btn.addEventListener("contextmenu", e => e.preventDefault());
  });
  if (document.getElementById("ccard")) { startCompass(dgUi.kickCompass); dgUi.kickCompass = false; }
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-dg],[data-act],[data-sp],[data-inv],[data-sup],[data-guard],[data-eat]");
  if (!el || !state.run || location.hash !== "#labyrinth") return;
  const ds = el.dataset, inv = inventory(), r = state.run;
  if (ds.inv) {
    if (dgUi.justLit) { dgUi.justLit = false; return; }
    const it = invItem(ds.inv);
    if (!it.active) return;
    if (ds.inv === "compass") { inv.compassOn = !inv.compassOn; dgUi.kickCompass = inv.compassOn; saveChar(); }
    else { dgUi.map = ds.inv === "mmap" ? "magic" : "plain"; }
    rerender(); return;
  }
  if (ds.sp) { dgUi.inv = false; dgUi.sup = false; dgUi.gm = false; dgUi.spDo = ds.sp; act("sp"); return; }
  if (ds.act) {
    dgUi.inv = false; dgUi.sup = false; dgUi.gm = false; dgUi.path = [];
    if (ds.act === "rest") {
      let food = partyFood();
      const eat = {};
      for (const c of state.party) { eat[c.id] = food > 0 ? 1 : 0; food -= eat[c.id]; }
      dgUi.rest = { guard: {}, eat };
    }
    if (ds.act === "explore" || ds.act === "dig") dgUi.sr = { pick: null, luck: null };
    dgUi.phase = ds.act;
    rerender(); return;
  }
  if (ds.guard) { dgUi.rest.ng = false; dgUi.rest.guard[ds.guard] = !dgUi.rest.guard[ds.guard]; rerender(); return; }
  if (ds.eat) {
    const eaten = Object.values(dgUi.rest.eat).reduce((a, b) => a + b, 0), d = Number(ds.d);
    if (d > 0 && eaten >= partyFood()) return;
    dgUi.rest.eat[ds.eat] = Math.max(0, (dgUi.rest.eat[ds.eat] || 0) + d);
    rerender(); return;
  }
  switch (ds.dg) {
    case "inv": dgUi.inv = !dgUi.inv; dgUi.sup = false; break;
    case "sup": dgUi.sup = !dgUi.sup; dgUi.inv = false; break;
    case "sack": openSack(); return;
    case "gm": dgUi.gm = !dgUi.gm; dgUi.confirm = null; break;
    case "cancel": dgUi.phase = "menu"; dgUi.path = []; dgUi.rest = null; dgUi.sr = null; break;
    case "sr-n": dgUi.sr.pick = Number(ds.n); if (dgUi.sr.pick !== 20) dgUi.sr.luck = null; break;
    case "sr-l": dgUi.sr.luck = Number(ds.n); break;
    case "sr-ok": act(dgUi.phase); return;
    case "res-done": dgUi.res = null; break;
    case "portal-go": switchFloor(); return;
    case "rest-go": act("rest"); return;
    case "zoom-in": dgUi.zoom = clampZoom(dgUi.zoom * 1.25); applyRotation(); return;
    case "zoom-out": dgUi.zoom = clampZoom(dgUi.zoom / 1.25); applyRotation(); return;
    case "close-map": dgUi.map = false; break;
    case "torch-on":
      if (r.torchLeft > 0) { r.light = true; logRun(`Факел снова зажжён (осталось ${r.torchLeft} д.).`); saveChar(); break; }
      { const h = burnTorch(); if (h) { r.light = true; r.torchLeft = 4; logRun(`${h.name} зажёг факел: яркий свет 6 м на 4 действия. Скрытно двигаться нельзя, летучки летят на свет.`); saveChar(); } }
      break;
    case "torch-off": r.light = false; logRun(`Факел погашен (хватит ещё на ${r.torchLeft} д.).`); saveChar(); break;
    case "enc-done": dgUi.enc = null; break;
    case "enc-out": dgUi.enc.outcome = ds.o; if (ds.o === "win") dgUi.enc.killed = []; break;
    case "enc-kill": { const k = dgUi.enc.killed, i = Number(ds.i); k.includes(i) ? k.splice(k.indexOf(i), 1) : k.push(i); break; }
    case "enc-ok": finishFight(); dgUi.stat = null; saveChar(); break;
    case "enc-stat": dgUi.stat = ds.id; break;
    case "stat-close": dgUi.stat = null; break;
    case "enc-hero": openHero(ds.id); return;
    case "enc-next": { const e = dgUi.enc, n = e.init.length; let t = e.turn;
      for (let k = 0; k < n; k++) { t = (t + 1) % n; if (t === 0) e.round++; const r = e.init[t]; if (!(r.k === "mon" && e.killed.includes(r.i))) break; }
      e.turn = t; break; }
    case "gm-enc": dgUi.gm = false;
      if (zoneAt(r.pos.x, r.pos.y).kind === "safe") { toast("Возле статуи монстры не появляются"); break; }
      if (r.tier) { toast("В ярусе встречи заданы составом яруса"); break; }
      askRoll("gm", true); saveChar(); break;
    case "roll-n": r.pending.pick = Number(ds.n); break;
    case "roll-ok": resolveRoll(); saveChar(); break;
    case "roll-cancel": r.pending = null; saveChar(); break;
    case "library": openLibrary(); return;
    case "give-tr": giveTreasure(ds.id); saveChar(); toast("Мастер выдал сокровище: " + TREASURES[ds.id].name); break;
    case "tr-tap": {
      const id = ds.id, r = state.run;
      if (id === "flame" && !r.flame) { r.flame = { left: 3 }; logRun("Следующие 3 перемещения подсветят дорогу к ближайшему порталу."); saveChar(); toast("Зажжено: 3 перемещения"); dgUi.inv = false; break; }
      trInfo(id); return;
    }
    case "flask-toggle": { const rs = dgUi.rest; if (trReady("flask")) rs.flask = !rs.flask; break; }
    case "dice-reroll": {
      if (!trReady("dice")) break;
      const rp = state.run.pending;
      if (rp && rp.pick) { logRun(`Игральные кубики: бросок ${rp.pick} перебрасывается.`); rp.pick = null; }
      else if (dgUi.sr && dgUi.sr.pick) { logRun(`Игральные кубики: бросок ${dgUi.sr.luck || dgUi.sr.pick} перебрасывается.`); if (dgUi.sr.luck) dgUi.sr.luck = null; else { dgUi.sr.pick = null; dgUi.sr.luck = null; } }
      else break;
      cdSet("dice"); saveChar(); break;
    }
    case "cup-toggle": { const rs = dgUi.rest; rs.cup ||= {}; rs.cup[ds.id] = !rs.cup[ds.id]; break; }
    case "hearth-toggle": { const rs = dgUi.rest; if (!state.run.hearthUsed) rs.hearth = !rs.hearth; break; }
    case "ng-toggle": { const rs = dgUi.rest; if (rs.ng) rs.ng = false; else if (ngCharges() > 0) { rs.ng = true; rs.guard = {}; } break; }
    case "give-compass": inv.compass.owned = true; saveChar(); toast("Мастер выдал компас"); break;
    case "give-map": invItem("map").owned = true; saveChar(); toast("Мастер выдал карту этажа"); break;
    case "give-mmap": invItem("mmap").owned = true; saveChar(); toast("Мастер выдал магическую карту"); break;
    case "leave": if (dgUi.confirm !== "leave") { dgUi.confirm = "leave"; break; } endRun(true); return;
    case "rollback": if (!state.runSnap) break; if (dgUi.confirm !== "rollback") { dgUi.confirm = "rollback"; break; } rollbackRun(); return;
  }
  rerender();
});

/* ----- монеты: у каждого героя свой кошелёк (c.gold), веса нет, делятся при гибели героя ----- */
const COIN_SVG = `<svg class="coin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#e5b84f" stroke="#7a5412" stroke-width="1.5"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#9a6d1c" stroke-width="1.2"/><path d="M12 8.5v7M10 10.5h3.2a1.2 1.2 0 010 2.4H10.8" stroke="#7a5412" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>`;
const goldOf = c => Math.max(0, Math.floor(c.gold || 0));
const partyGold = () => state.party.reduce((a, c) => a + goldOf(c), 0);
const addGold = (c, n) => { c.gold = goldOf(c) + Math.max(0, Math.floor(n)); };
// Платит prefer, если не хватает — добирают остальные (сначала самые богатые). false — монет в отряде мало.
function payGold(prefer, cost) {
  if (partyGold() < cost) return false;
  let left = cost;
  for (const c of [prefer, ...state.party.filter(x => x.id !== prefer.id).sort((a, b) => goldOf(b) - goldOf(a))]) {
    const t = Math.min(left, goldOf(c)); c.gold = goldOf(c) - t; left -= t; if (!left) break;
  }
  return true;
}
function itemInfoText(it) {
  const parts = [];

const essTitle = id => (essNameKnown(id) && ESSENCES[id] ? ESSENCES[id].name : "Эссенция ??");
const ESS_UNK_FACE = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#120e09"/><circle cx="50" cy="50" r="30" fill="#2a2016" stroke="#6e5634" stroke-width="3"/><text x="50" y="64" font-size="42" text-anchor="middle" fill="#d6a64c" font-family="serif">?</text></svg>');

const essActiveLevel = id => (essSeen(id, "ess-active") ? 2 : essUsed(id) ? 1 : 0);          // 0 — неизвестна, 1 — название, мана, урон, 2 — всё

// Применение находки вне боя (в бою — battle-env.js). Возвращает текст результата.
function applyFindOut(c, id) {
  const g = GEAR[id], f = g.fnd, x = f.fx, st = state.run && state.run.status && state.run.status[c.id], out = [`${f.name}`];
  const hurt = n => { c.hp = Math.max(0, hpOf(c) - n); if (c.hp <= 0) c.hp = 1; };          // вне боя находка не убивает
  if (x.heal) { const h = roll(x.heal[0], x.heal[1]) + x.heal[2], b = hpOf(c); c.hp = Math.min(maxHp(c), b + h); out.push(`ОЗ ${b} → ${c.hp}`); }
  if (x.mp) { const b = mpOf(c); c.mp = Math.min(maxMp(c), b + x.mp); out.push(`мана ${b} → ${c.mp}`); }
  if (x.poison) { const d = roll(x.poison[0], x.poison[1]) + x.poison[2]; hurt(d); out.push(`яд: −${d} ОЗ`); }
  if (x.boom) { const d = roll(x.boom[0], x.boom[1]) + x.boom[2]; hurt(d); out.push(`взрыв во рту: −${d} ОЗ`); }
  if (x.sat) { if (st) { st.sat = Math.min(9, st.sat + x.sat); st.starve = 0; out.push(`сытость +${x.sat}`); } else out.push("сытость (вне захода не считается)"); }
  if (x.fat) { if (st) { const b = st.fat || 0; st.fat = Math.max(0, b - x.fat); out.push(`Усталость ${b} → ${st.fat}`); } }
  if (x.light) { const r = state.run; if (r) { r.light = true; r.torchLeft = Math.max(r.torchLeft || 0, 3); out.push("светит как факел (3 действия)"); } }
  return out.length > 1 ? `${out[0]}: ${out.slice(1).join(", ")}` : `${out[0]}: ничего не произошло`;
}

function heroAfterChange(msg) {

let holdInfo = { t: 0, fired: false, x: 0, y: 0 };
$hero.addEventListener("pointerdown", e => {
  holdInfo.fired = false;
  const el = e.target.closest("[data-hbag],[data-hslot]"); if (!el || !heroUi) return; holdInfo.x = e.clientX; holdInfo.y = e.clientY; clearTimeout(holdInfo.t);
  holdInfo.t = setTimeout(() => {
    const c = heroById(heroUi.id); if (!c) return;
    const ent = el.dataset.hbag !== undefined ? c.bag[+el.dataset.hbag] : c.equip[el.dataset.hslot];
    if (ent) { holdInfo.fired = true; showItemInfo(ent, c); }
  }, 450);
});
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) $hero.addEventListener(ev, () => clearTimeout(holdInfo.t), true);
$hero.addEventListener("pointermove", e => { if (Math.hypot(e.clientX - holdInfo.x, e.clientY - holdInfo.y) > 10) clearTimeout(holdInfo.t); });
$hero.addEventListener("click", e => {
  if (holdInfo.fired) { holdInfo.fired = false; return; }
  if (e.target === $hero) { closeHero(); return; }
  const el = e.target.closest("[data-hx],[data-hbag],[data-hslot],[data-hadd]");
  if (!el) return;
  const ds = el.dataset, c = heroById(heroUi.id);
  if (ds.hbag !== undefined) { const i = +ds.hbag; heroUi.sel = heroUi.sel === i ? null : i; heroUi.slot = null; heroUi.give = false; renderHero(); return; }
  if (ds.hslot) { heroUi.slot = heroUi.slot === ds.hslot ? null : ds.hslot; heroUi.sel = null; heroUi.give = false; renderHero(); return; }
  if (ds.hadd) {
    const [t, id, q] = ds.hadd.split(":");
    const left = addToBag(c, { t, id, qty: +q });
    heroAfterChange(left ? "Рюкзак полон: не поместилось" : "Добавлено в рюкзак"); return;
  }
  const entry = heroUi.sel !== null ? c.bag[heroUi.sel] : null;
  switch (ds.hx) {
    case "close": closeHero(); return;
    case "sack": openSack(); return;
    case "tab": heroUi.tab = ds.tabTo; heroUi.sel = null; heroUi.slot = null; renderHero(); return;
    case "add-toggle": heroUi.add = !heroUi.add; renderHero(); return;
    case "hp": c.hp = Math.max(0, Math.min(maxHp(c), hpOf(c) + Number(ds.d))); heroAfterChange(); return;
    case "luck": c.luck = luckOf(c) + Number(ds.d); heroAfterChange(); return;
    case "mp": c.mp = Math.max(0, Math.min(maxMp(c), mpOf(c) + Number(ds.d))); heroAfterChange(); return;
    case "insp": c.insp = Math.max(0, (c.insp ?? 1) + Number(ds.d)); heroAfterChange(); return;
    case "revive": c.dead = false; c.hp = Math.max(1, hpOf(c)); heroAfterChange(`${c.name} воскрешён (1 ОЗ)`); return;
    case "ess-add-toggle": heroUi.essAdd = !heroUi.essAdd; renderHero(); return;
    case "ess-add": essStash().push(ds.essid); heroAfterChange(`В запас добавлено: ${ESSENCES[ds.essid].name}`); return;
    case "ess-take": {
      const st = essStash(), i = st.indexOf(ds.essid), mine = (c.essences ||= []);
      if (i < 0) return;
      if (mine.length >= c.level) { toast("Нет свободного слота эссенций"); return; }
      if (mine.includes(ds.essid)) { toast("У героя уже есть такая эссенция"); return; }
      st.splice(i, 1); mine.push(ds.essid); markEssNamed(ds.essid); c.mp = Math.min(maxMp(c), mpOf(c));
      heroAfterChange(`${c.name} впитал: ${ESSENCES[ds.essid].name}`); return;
    }
    case "ess-release": {
      const mine = c.essences || [], i = mine.indexOf(ds.essid); if (i < 0) return;
      mine.splice(i, 1); essStash().push(ds.essid); c.hp = Math.min(hpOf(c), maxHp(c)); c.mp = Math.min(mpOf(c), maxMp(c));
      heroAfterChange(`Эссенция убрана в запас отряда`); return;
    }
    case "coin-toggle": heroUi.coin = !heroUi.coin; renderHero(); return;
    case "coin-amt": heroUi.coinAmt = +ds.n; renderHero(); return;
    case "coin-give": {
      const to = heroById(ds.to), n = Math.min(heroUi.coinAmt || 1, goldOf(c)); if (!to || n < 1) return;
      c.gold = goldOf(c) - n; addGold(to, n); heroAfterChange(`${n} монет: ${c.name} → ${to.name}`); return;
    }
    case "give-toggle": heroUi.give = !heroUi.give; renderHero(); return;
    case "eat": {
      takeGear(c, "ration", 1);
      const st = state.run && state.run.status && state.run.status[c.id];
      if (st) { st.sat = Math.min(9, st.sat + 3); st.starve = 0; logRun(`${c.name} съел паёк.`); }
      heroUi.sel = c.bag.indexOf(entry) >= 0 ? heroUi.sel : null;
      heroAfterChange(`${c.name} съел паёк`); return;
    }
    case "usefind": {
      const g = GEAR[entry.id]; if (!g || !g.find) return;
      entry.qty--; if (!entry.qty) { c.bag.splice(heroUi.sel, 1); heroUi.sel = null; }
      const txt = applyFindOut(c, entry.id);
      if (state.run) logRun(`${c.name}: ${txt}`);
      heroAfterChange(txt); return;
    }
    case "kills": openKills(c); return;
    case "chalice-drink": {
      if (!chaliceEmpty(c)) return;
      const heal = roll(2, 4) + 4, before = hpOf(c); c.hp = Math.min(maxHp(c), before + heal);
      if (state.run) logRun(`${c.name} выпил из чаши здоровья: 2к4 + 4 = ${heal}, ОЗ ${before} → ${c.hp}. Чаша пуста.`);
      heroAfterChange(`Чаша: +${heal} ОЗ (${before} → ${c.hp}), чаша снова пуста`); return;
    }
    case "chalice-fill": {
      if (!entry || chaliceSt(entry) !== "empty" || !canFillWater()) return;
      chaliceFill(entry); if (state.run) logRun(`${c.name} наполняет чашу здоровья водой: через 2 дня будет зелье.`);
      heroAfterChange("Чаша наполнена водой: через 2 дня станет зельем"); return;
    }
    case "drink": {
      entry.qty--; if (!entry.qty) { c.bag.splice(heroUi.sel, 1); heroUi.sel = null; }
      const good = entry && entry.id === "potion-good", heal = good ? roll(2, 4) + 4 : roll(1, 4) + 2, before = hpOf(c);
      c.hp = Math.min(maxHp(c), before + heal);
      if (state.run) logRun(`${c.name} выпил ${good ? "зелье" : "слабое зелье"} лечения: ${good ? "2к4 + 4" : "1к4 + 2"} = ${heal}, ОЗ ${before} → ${c.hp}.`);
      heroAfterChange(`Зелье: +${heal} ОЗ (${before} → ${c.hp})`); return;
    }
    case "equip": {
      const slot = ds.slotTo, it = itemOf(entry);
      c.bag.splice(heroUi.sel, 1); heroUi.sel = null;
      const prev = c.equip[slot];
      c.equip[slot] = entry.t === "c" ? { t: "c", name: entry.name } : { t: entry.t, id: entry.id, ...(entry.steel ? { steel: true } : {}) };
      if (prev) addToBag(c, { ...prev, qty: 1 });
      if (slot === "main" && isTwoHandedWeapon(it) && !(c.giantGrip && c.race === "barbarian") && c.equip.off) {
        if (addToBag(c, { ...c.equip.off, qty: 1 })) { toast("Нет места для предмета из левой руки"); c.equip.main = prev; c.bag.push(entry); if (prev) takeLast(c, prev); saveChar(); renderHero(); return; }
        delete c.equip.off;
      }
      heroAfterChange(`${it.name}: надето`); return;
    }
    case "unequip": {
      const e2 = c.equip[heroUi.slot];
      if (addToBag(c, { ...e2, qty: 1 })) { toast("Рюкзак полон"); return; }
      delete c.equip[heroUi.slot]; heroUi.slot = null;
      heroAfterChange("Снято в рюкзак"); return;
    }
    case "give": {
      const to = heroById(ds.to);
      const left = addToBag(to, { ...entry });
      if (left === entry.qty) { toast(`У ${to.name} рюкзак полон`); return; }
      entry.qty = left; if (!entry.qty) c.bag.splice(heroUi.sel, 1);
      heroUi.sel = null; heroUi.give = false;
      heroAfterChange(left ? `Передано частично: у ${to.name} не хватило места` : `Передано: ${to.name}`); return;
    }
    case "drop-all": {
      c.bag.splice(heroUi.sel, 1); heroUi.sel = null;
      heroAfterChange("Выброшено"); return;
    }
    case "drop-eq": {
      if (!c.equip[heroUi.slot]) return;
      delete c.equip[heroUi.slot]; heroUi.slot = null;
      heroAfterChange("Выброшено"); return;
    }
    case "drop": {
      entry.qty = (entry.qty || 1) - 1;
      if (entry.qty <= 0) { c.bag.splice(heroUi.sel, 1); heroUi.sel = null; }
      heroAfterChange("Выброшено"); return;
    }
  }
});
function takeLast(c, e) { for (let i = c.bag.length - 1; i >= 0; i--) if (c.bag[i].t === e.t && c.bag[i].id === e.id) { c.bag.splice(i, 1); return; } }

// Удержание карточки героя ≈ 0,5 с открывает его меню. Сдвиг пальца (прокрутка) отменяет.

const ICO_BOOK = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H12v17H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 4.5A1.5 1.5 0 0 0 18.5 3H12v17h6.5a1.5 1.5 0 0 0 1.5-1.5z"/><path d="M7 7h2.5M14.5 7H17M7 10h2.5M14.5 10H17"/></svg>`;

function journal() { state.journal ||= { unlocked: false, tiers: [], known: {} }; state.journal.hints ||= {}; return state.journal; }
function unlockJournal(cls) {
  const j = journal();
  if (!j.unlocked || !j.tiers.includes(cls)) { j.unlocked = true; if (!j.tiers.includes(cls)) j.tiers.push(cls); }
}
const libMonsters = () => MONSTERS.filter(m => m.floor === 1 && !m.draft && journal().tiers.includes(m.cls));
const MON_PH = `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#120e09"/><circle cx="50" cy="42" r="18" fill="#2a2016" stroke="#6e5634"/><path d="M18 100 C22 74 36 66 50 66 C64 66 78 74 82 100Z" fill="#2a2016" stroke="#6e5634"/></svg>`;
const monArt = (m, full) => (full ? ART.monsterFull(m.id) : ART.monsterFace(m.id));

// Разделы карточки монстра — каждый раскрывается отдельно. Имя и класс видны всегда.
// Эссенция делится на три части: статы, пассивная и активная способность.
const MON_TYPES = ["Гуманоид", "Зверь", "Нежить", "Конструкт", "Элементаль", "Чудовище"];
function monSections(m) {
  const list = arr => `<ul>${arr.map(([n, t]) => `<li><b>${n}.</b> ${t}</li>`).join("")}</ul>`;
  const byCat = cat => m.traits.filter(t => t[2] === cat);
  const secs = [
    { k: "area", label: "Места обитания", html: (m.areas || [m.floor + " этаж"]).length > 1 ? `<ul>${m.areas.map(a => `<li>${a}</li>`).join("")}</ul>` : (m.areas || [m.floor + " этаж"])[0] },
    { k: "type", label: "Тип", html: `${m.type || "—"}, ${m.sz || m.size.toLowerCase()}` },
    ...(m.spawn ? [{ k: "spawn", label: "Условия появления", html: m.spawn }] : []),
    ...(byCat("body").length ? [{ k: "body", label: "Особенность тела", html: list(byCat("body")) }] : []),
    { k: "stats", label: "Характеристики", html: `КД ${m.ac} · ОЗ ${m.hp} · скорость ${m.speed} · опасность ${m.cr}
      ${m.abil ? `<dl class="abil">${STAT_KEYS.map((k, i) => `<div><dt>${STAT_SHORT[k]}</dt><dd>${m.abil[i]}<small>${signed(mod(m.abil[i]))}</small></dd></div>`).join("")}</dl>` : ""}
      <div style="margin-top:6px">${m.senses}</div>
      ${byCat("behavior").length ? `<div class="lib-sub">Поведение</div>${list(byCat("behavior"))}` : ""}${byCat("attacks").length ? `<div class="lib-sub">Атаки</div>${list(byCat("attacks"))}` : ""}` },
  ];
  if (m.essence) {
    const e = ESSENCES[m.essence];
    secs.push({ k: "ess-stats", group: "Эссенция", label: "Статы", html: STAT_KEYS.filter(k => e.stats[k]).map(k => `${STAT_NAME[k]} ${signed(e.stats[k])}`).concat(e.other).join(" · ") });
    secs.push({ k: "ess-passive", group: "Эссенция", label: `Пассивная способность`, html: `<b>${e.passive.name}.</b> ${e.passive.text}` });
    secs.push({ k: "ess-active", group: "Эссенция", label: `Активная способность`, html: `<b>${e.active.name}.</b> ${e.active.mana} маны, ${e.active.time}. ${e.active.text}` });

  return secs;

// Старые записи библиотеки: переносим раскрытые разделы на новую схему.
function migrateRevealed(rec) {

}

$lib.addEventListener("click", e => {

  const ds = el.dataset, j = journal();
  switch (ds.lx) {
    case "close": closeLibrary(); return;
    case "tab": libUi.tab = ds.tab; libUi.card = null; libUi.adding = false; break;
    case "art": artInfo(ds.id, ARTIFACTS[ds.id].cls ? "" : ""); return;
    case "add": libUi.adding = true; libUi.q = ""; libUi.pick = null; break;
    case "cancel-add": libUi.adding = false; break;
    case "pick": {

    case "open": libUi.card = ds.id; libUi.reveal = false; libUi.sel = []; break;
    case "close-card": libUi.card = null; break;
    case "reveal": libUi.reveal = true; libUi.sel = []; break;
    case "cancel-reveal": libUi.reveal = false; libUi.sel = []; break;
    case "toggle": libUi.sel = libUi.sel.includes(ds.k) ? libUi.sel.filter(k => k !== ds.k) : [...libUi.sel, ds.k]; break;
    case "confirm-reveal": {
      const rec = j.known[libUi.card];

});

// В APK кнопка просит Android (window.SputnikApp) проверить и скачать обновление, «Применить» перезагружает страницу на новой версии.
// Ответ приходит в window.sputnikUpdate. Без моста (старый APK) — просто сравниваем номер версии с GitHub.
let updUi = { state: "idle", note: "" };
const UPD_LABEL = { idle: "Проверить обновление", checking: "Проверяю…", latest: "Проверить обновление", downloaded: "Применить обновление", error: "Проверить обновление", old: "Проверить обновление" };
function updShow(stateName, note) { updUi = { state: stateName, note }; if (!location.hash || location.hash === "#") rerender(); else if (stateName === "downloaded") toast("Обновление скачано: примени его на главном экране"); }
window.sputnikUpdate = (status, version) => {
  if (status === "downloaded") updShow("downloaded", "Новая версия скачана. Нажми, чтобы применить — игра сохранится.");
  else if (status === "latest") updShow("latest", "Установлена последняя версия.");
  else updShow("error", "Нет связи с сервером обновлений. Проверь интернет.");
};
async function checkUpdate() {
  updShow("checking", "");
  if (window.SputnikApp) {
    window.SputnikApp.checkUpdate();
    setTimeout(() => { if (updUi.state === "checking") updShow("error", "Сервер долго не отвечает. Попробуй ещё раз."); }, 25000);
    return;
  }
  try {
    const v = (await (await fetch(UPDATE_URL + "version.json?t=" + Date.now(), { cache: "no-store" })).json()).version;
    updShow(v > APP_VERSION ? "old" : "latest", v > APP_VERSION ? "Есть новая версия. Закрой приложение и открой снова — она скачается сама. Чтобы обновляться этой кнопкой, поставь новый APK." : "Установлена последняя версия.");
  } catch (e) { updShow("error", "Нет связи с сервером обновлений. Проверь интернет."); }
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-upd]"); if (!el) return;
  if (el.dataset.upd === "check") checkUpdate();
  else if (window.SputnikApp) { saveChar(); window.SputnikApp.applyUpdate(); }
});

// Просто бросок для удобства: результат никуда не записывается.
const DICE = [4, 6, 8, 10, 12, 20, 100];
const DIE_SHAPE = {
  4: "M50 6 94 88H6z", 6: "M12 12h76v76H12z", 8: "M50 4 94 50 50 96 6 50z", 10: "M50 4 92 42 50 96 8 42z",
  12: "M50 4 95 37 78 92H22L5 37z", 20: "M50 3 92 27v46L50 97 8 73V27z", 100: "M50 4 92 42 50 96 8 42z",
};
let dice = { type: 20, n: 1, vals: null, timer: 0 };
const $dice = document.getElementById("diceov");
function dieSvg(t) { return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="${DIE_SHAPE[t]}" fill="#2a1f12" stroke="#d6a64c" stroke-width="3" stroke-linejoin="round"/><path d="${DIE_SHAPE[t]}" fill="none" stroke="#f0c979" stroke-width="1" opacity=".35" transform="translate(50 50) scale(.72) translate(-50 -50)"/></svg>`; }
function renderDice() {
  const d = dice, many = d.n > 1, vals = d.vals || Array(d.n).fill(null);
  $dice.innerHTML = `<div class="dice-sheet">
    <div class="ph-head"><h3>Кубики</h3><button class="fx-btn" data-dice="close" aria-label="Закрыть" style="width:42px;height:42px;padding:0;display:grid;place-items:center">${ICO_X}</button></div>
    <div class="dice-types" role="group" aria-label="Кубик">${DICE.map(t => `<button class="fx-btn${d.type === t ? " on" : ""}" data-dice="type" data-t="${t}" aria-pressed="${d.type === t}">к${t}</button>`).join("")}</div>
    <div class="dice-count">Сколько: ${[1, 2, 3, 4, 5, 6].map(n => `<button class="fx-btn${d.n === n ? " on" : ""}" data-dice="n" data-n="${n}" aria-pressed="${d.n === n}">${n}</button>`).join("")}</div>
    <div class="dice-stage${many ? " many" : ""}" data-dice="roll" id="dice-stage" aria-live="polite">
      ${vals.map(v => `<div class="die${v !== null && d.type === 20 && v === 20 ? " crit" : ""}${v !== null && d.type === 20 && v === 1 ? " fail" : ""}">${dieSvg(d.type)}<b>${v === null ? "к" + d.type : v}</b></div>`).join("")}
    </div>
    <div class="dice-total">${d.vals && many ? `Сумма: <b>${d.vals.reduce((a, b) => a + b, 0)}</b>` : d.vals && d.type === 20 && d.vals[0] === 20 ? "Критический успех!" : d.vals && d.type === 20 && d.vals[0] === 1 ? "Критический провал" : "Нажми на кубик или «Бросить»"}</div>
    <button class="fx-btn primary big" data-dice="roll">Бросить ${d.n > 1 ? d.n : ""}к${d.type}</button>
  </div>`;
}
function rollDice() {
  clearInterval(dice.timer);
  const d = dice, roll = () => Array.from({ length: d.n }, () => 1 + rnd(d.type));
  const final = roll();
  d.vals = roll(); renderDice();
  document.querySelectorAll("#dice-stage .die").forEach(el => el.classList.add("rolling"));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let ticks = reduce ? 0 : 10;
  const step = () => {
    if (ticks-- > 0) { const v = roll(); document.querySelectorAll("#dice-stage .die b").forEach((b, i) => b.textContent = v[i]); return; }
    clearInterval(d.timer); d.vals = final; renderDice();
  };
  if (reduce) step(); else d.timer = setInterval(step, 70);
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-dice]");
  if (!el) { if (e.target === $dice) { $dice.hidden = true; } return; }
  const k = el.dataset.dice;
  if (k === "open") { dice.vals = null; renderDice(); $dice.hidden = false; return; }
  if (k === "close") { clearInterval(dice.timer); $dice.hidden = true; return; }
  if (k === "type") { dice.type = Number(el.dataset.t); dice.vals = null; renderDice(); return; }
  if (k === "n") { dice.n = Number(el.dataset.n); dice.vals = null; renderDice(); return; }
  if (k === "roll") rollDice();
});

function writeSaves(list) { try { localStorage.setItem(SAVES_KEY, JSON.stringify(list)); return true; } catch (e) { toast("Не хватило места для сохранения"); return false; } }
function saveSummary(st) {
  const names = (st.party || []).map(c => c.name).join(", ") || "без героев";
  const where = st.run ? `лабиринт, день ${st.run.day}/7, действие ${st.run.act}` : st.townUnlocked ? "город" : "до первого спуска";
  return `${names} · ${where}`;
}
function makeSave(name) {
  const list = readSaves();
  const now = new Date();
  list.unshift({ id: "s" + now.getTime().toString(36), name: name || "Сохранение " + now.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }),
    date: now.toISOString(), info: saveSummary(state), data: JSON.stringify(state, (k, v) => (k === "fightSnap" ? undefined : v)) });
  return writeSaves(list.slice(0, 15));
}
// Автосохранение: один отдельный слот «Автосохранение», перезаписывается (перед боем, после боя, раз в две минуты в заходе).
function autoSave(why) {
  try {
    const list = readSaves().filter(x => !x.auto), now = new Date();
    list.unshift({ id: "auto", auto: true, name: "Автосохранение" + (why ? " · " + why : ""), date: now.toISOString(), info: saveSummary(state), data: JSON.stringify(state, (k, v) => (k === "fightSnap" ? undefined : v)) });
    writeSaves(list.slice(0, 15));
  } catch (e) { /* не страшно */ }
}
setInterval(() => { if (state.run) autoSave(); }, 120000);
document.addEventListener("visibilitychange", () => { if (document.hidden) { try { saveChar(); } catch (e) {} if (state.run) autoSave("свёрнуто"); } });
window.addEventListener("pagehide", () => { try { saveChar(); } catch (e) {} });
// Возврат боя после перезагрузки страницы (снимок в начале каждого хода, battle.js → snapshot).
function resumeFight() {
  const sn = state.fightSnap; if (!sn || !state.run || !window.Battle || !window.Battle.ready) return;
  dgUi.enc = sn.ev; location.hash = "labyrinth"; rerender();
  window.Battle.resume(sn.ev, sn.S);
}
function loadSave(id) {
  const sv = readSaves().find(x => x.id === id); if (!sv) return;
  makeSave("Авто: перед загрузкой «" + sv.name + "»");
  state = { party: [], sessions: [], current: null, example: clone(DEFAULT_CHAR), ...JSON.parse(sv.data) };
  char = curChar(); dgUi = freshUi(); saveChar();
  $saves.hidden = true;
  if (!document.getElementById("libov").hidden) closeLibrary();
  if (!document.getElementById("heroov").hidden) closeHero();
  location.hash = state.run ? "labyrinth" : state.townUnlocked ? "town" : "";
  rerender();
  setTimeout(() => toast("Загружено: " + sv.name), 50);
}
// Начать с нуля: текущая игра сохраняется в слот «Партия до сброса» (её можно загрузить обратно), потом всё стирается — отряд, город, библиотека, инвентарь.
function startOver() {
  makeSave("Партия до сброса");
  state = { party: [], sessions: [], current: null, example: clone(DEFAULT_CHAR) };
  char = curChar(); dgUi = freshUi(); saveChar();
  $saves.hidden = true;
  if (!document.getElementById("libov").hidden) closeLibrary();
  if (!document.getElementById("heroov").hidden) closeHero();
  location.hash = ""; rerender();
  setTimeout(() => toast("Начато с нуля. Прежняя партия — в «Сохранениях»."), 50);
}
function renderSaves() {
  const list = readSaves(), c = saveUi.confirm;
  $saves.innerHTML = `<div class="dice-sheet">
    <div class="ph-head"><h3>Сохранения</h3><button class="fx-btn" data-save="close" aria-label="Закрыть" style="width:42px;height:42px;padding:0;display:grid;place-items:center">${ICO_X}</button></div>
    <p class="save-note">Сейчас: ${esc(saveSummary(state))}. Сохранения лежат на этом телефоне. Перед загрузкой текущая игра сохраняется автоматически.</p>
    <button class="fx-btn primary big" data-save="new">Сохранить текущую игру</button>
    <button class="fx-btn${c === "reset" ? " danger" : ""}" data-save="reset" style="margin-top:8px">${c === "reset" ? "Точно начать с нуля? Ещё раз" : "Начать с нуля (удалить героев)"}</button>
    <div class="save-list">${list.length ? list.map(sv => `<div class="save-row">
      <b>${esc(sv.name)}</b><small>${new Date(sv.date).toLocaleString("ru-RU", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" })} · ${esc(sv.info)}</small>
      <div class="btns"><button class="fx-btn" data-save="load" data-id="${sv.id}">${c === "load:" + sv.id ? "Точно загрузить? Ещё раз" : "Загрузить"}</button>
      <button class="fx-btn" data-save="del" data-id="${sv.id}">${c === "del:" + sv.id ? "Точно удалить? Ещё раз" : "Удалить"}</button></div></div>`).join("")
      : `<p class="save-note" style="text-align:center">Сохранений пока нет.</p>`}</div>
  </div>`;
}
function openSaves() { saveUi = { confirm: null }; renderSaves(); $saves.hidden = false; }
document.addEventListener("click", e => {
  const el = e.target.closest("[data-save]");
  if (!el) { if (e.target === $saves) $saves.hidden = true; return; }
  const k = el.dataset.save, id = el.dataset.id;
  if (k === "open") { openSaves(); return; }
  if (k === "close") { $saves.hidden = true; return; }
  if (k === "new") { if (makeSave()) toast("Игра сохранена"); saveUi.confirm = null; renderSaves(); return; }
  if (k === "reset") {
    if (saveUi.confirm !== "reset") { saveUi.confirm = "reset"; renderSaves(); return; }
    saveUi.confirm = null; startOver(); return;
  }
  if (k === "load" || k === "del") {
    if (saveUi.confirm !== k + ":" + id) { saveUi.confirm = k + ":" + id; renderSaves(); return; }
    saveUi.confirm = null;
    if (k === "load") { loadSave(id); return; }
    writeSaves(readSaves().filter(x => x.id !== id)); renderSaves();
  }
});

document.addEventListener("click", e => {
  const el = e.target.closest("[data-go],[data-tab],[data-f],[data-reset],[data-zoom],[data-slot],[data-equip],[data-unequip],[data-custom],[data-action],[data-member],[data-bld]");
  if (!el) return;
  const ds = el.dataset;
  if (ds.go === "library") { openLibrary(); return; }
  if (ds.go !== undefined) { location.hash = ds.go; return; }
  if (ds.tab !== undefined) { const onFx = ["", "town", "labyrinth"].includes(location.hash.slice(1)); location.hash = ds.tab === "" && !onFx && lastFx ? lastFx : ds.tab; return; }          // из справочника «Главная» ведёт обратно в подземелье или город
  if (ds.f) {
    const scope = el.closest("[data-scope]").dataset.scope;
    const st = scope === "w" ? wf : scope === "a" ? af : mf;
    st[ds.f] = ds.v;
    rerender(); return;
  }
  if (ds.reset) {
    if (ds.reset === "w") wf = { ...WF_DEFAULT };
    if (ds.reset === "a") af = { ...AF_DEFAULT };
    if (ds.reset === "m") mf = { ...MF_DEFAULT };
    rerender(); return;
  }
  if (ds.zoom) { openSheet(ds.alt, `<div class="bigart">${img(ds.zoom, ds.alt)}</div>`); return; }
  if (ds.slot) { openSlot(ds.slot); return; }
  if (ds.equip) { equip(ds.equip, { t: ds.t, id: ds.id }); return; }
  if (ds.unequip) { delete char.equip[ds.unequip]; char.example = false; saveChar(); closeSheet(); rerender(); return; }
  if (ds.custom) {
    const name = document.getElementById("custom-name").value.trim();
    if (!name) { document.getElementById("custom-name").focus(); return; }
    equip(ds.custom, { t: "c", name }); return;
  }
  if (ds.action === "close-sheet") closeSheet();
  if (ds.action === "edit-char") openEdit();
  if (ds.action === "save-char") saveEdit();
  if (ds.action === "reset-char") { state.example = clone(DEFAULT_CHAR); saveChar(); closeSheet(); rerender(); }
  if (ds.action === "library") openLibrary();
  if (ds.action === "start-adventure") openForge(state.party.length ? "team" : "race", state.party.length ? "more" : "first");
  if (ds.member) { state.current = ds.member; saveChar(); rerender(); }
  if (ds.bld) {
    if (ds.bld === "gate") {
      const gi = gateInfo();
      if (!gi.open) { toast(`Врата закрыты: откроются через ${gi.left} городских действий.`); return; }
      location.hash = "labyrinth"; return;
    }
    const b = TOWN.find(x => x.id === ds.bld);
    if (!state.townUnlocked) { toast("Откроется после первого захода в лабиринт."); return; }
    if (b.soon) { toast(`«${b.name}» — скоро.`); return; }
    openBuilding(b.id); return;
  }

});
document.addEventListener("change", e => {
  if (e.target.id === "w-sort") { wf.sort = e.target.value; rerender(); }
  if (e.target.id === "a-sort") { af.sort = e.target.value; rerender(); }
  if (e.target.id === "giant") {
    char.giantGrip = e.target.checked;
    if (twoHanded()) delete char.equip.off;
    char.example = false; saveChar(); closeSheet(); rerender();
  }
});
document.addEventListener("toggle", e => {
  const m = e.target.dataset && e.target.dataset.mon;
  if (m) e.target.open ? openMonsters.add(m) : openMonsters.delete(m);
}, true);
document.addEventListener("input", e => {
  if (e.target.id === "q") { query = e.target.value; renderResults(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$sheet.hidden) closeSheet(); });
$scrim.addEventListener("click", closeSheet);
$back.addEventListener("click", () => { location.hash = "ref"; });
window.addEventListener("hashchange", () => route());
document.addEventListener("click", e => {
  const el = e.target.closest("[data-set]");
  if (el && el.dataset.set === "tactical") setTactical(!settings().tactical);
  if (el && el.dataset.set === "master") { settings().master = !settings().master; saveChar(); toast(settings().master ? "Режим мастера: виден весь бестиарий" : "Режим мастера выключен"); rerender(); }
});
if (settings().tactical) loadBattle().then(ok => { if (ok && state.fightSnap) resumeFight(); }); else state.fightSnap = null;
state.party.forEach(ensureKit);       // старые герои получают стартовый набор
// Первый запуск со слотами сохранений: текущая партия сохраняется сама, чтобы тесты ничего не испортили.
if (!readSaves().length && state.party.length) makeSave("Партия до тестов (сохранено автоматически)");
if (window.SputnikApp && window.SputnikApp.pending && window.SputnikApp.pending()) updUi = { state: "downloaded", note: "Новая версия скачана. Нажми, чтобы применить — игра сохранится." };
if (!location.hash && state.lastHash && (state.lastHash !== "labyrinth" || state.run)) location.hash = state.lastHash;          // после перезагрузки — на том же экране
route();
</script>
</body>
</html>
