plugins { id "com.android.application" }

android {
    namespace "rf.sputnik"
    compileSdk 35
    defaultConfig {
        applicationId "rf.sputnik"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1"
    }
    flavorDimensions "mode"
    productFlavors {
        // «Спутник исследователя» — ведущий (всё); «Спутник — Игрок» — клиент онлайн-партии (режим задаёт ресурс app_mode, страница читает его через SputnikApp.mode())
        master { dimension "mode"; applicationId "rf.sputnik" }
        player { dimension "mode"; applicationId "rf.sputnik.player"; versionNameSuffix "-player" }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
